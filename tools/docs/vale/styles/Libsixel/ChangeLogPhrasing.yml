extends: existence
message: "Review '%s': a reference page should describe the current contract; retain history only when it explains that contract."
level: suggestion
# Path labels such as tests/cli/options/migration/... are not historical prose.
scope: text & ~link
ignorecase: true
tokens:
  - previously
  - no longer
  - migration
  - rollout
  # Bare "used to" also describes present purpose ("is used to decode").
  - formerly
