extends: existence
message: "Review timing protocol '%s' against docs/quality/measurement-policy.md; an observation is not necessarily a competing rule."
level: suggestion
scope: text
ignorecase: true
# Require a count or timing context, avoiding unqualified dither warm-up rows.
tokens:
  - '(?:[0-9]+|one|two|three)[ -]warm[ -]?ups?(?:[ -](?:rounds|runs|pairs|calls))?'
  - '(?:[0-9]+|seven|nine|ten|eleven|twenty-one)[ -](?:(?:recorded|measured|timed|timing)[ -]){1,2}(?:runs|rounds|samples|calls|processes)'
  - 'median of (?:[0-9]+|seven|nine|ten|eleven|twenty-one)\b'
