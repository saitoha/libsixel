# Advisory prototype. Run tools/docs/lint-prose to apply doc-types.tsv scopes.
# Keep this opt-in beside the styles, rather than enabling every editor by default.
StylesPath = styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, kbd
SkippedScopes = script, style, pre

[docs/**/*.md]
BasedOnStyles = Libsixel
# Protect bare CLI options as well as the code spans skipped by Markdown parsing.
TokenIgnores = (--[A-Za-z][A-Za-z0-9_-]*(?:=[^\s`]+)?)
# The wrapper enables these only for classified user/both pages; change-history
# wording additionally requires primary type reference.
Libsixel.ContributorPaths = NO
Libsixel.CommitReferences = NO
Libsixel.ChangeLogPhrasing = NO

[docs/quality/**]
Libsixel.LocalProtocol = NO

[docs/testing/**]
Libsixel.LocalProtocol = NO

[docs/AGENTS.md]
Libsixel.LocalProtocol = NO
