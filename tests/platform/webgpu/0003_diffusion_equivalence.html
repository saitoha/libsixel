<!doctype html>
<meta charset="utf-8">
<title>WebGPU phased diffusion equivalence</title>
<pre id="tap">1..1
</pre>
<script src="img2sixel.js"></script>
<script type="module">
// SPDX-License-Identifier: MIT
// Run beside the thread-disabled, modularized CLI described in build.md.
// 17 x 13 exercises a partial input word and a partial output workgroup.
const header = new TextEncoder().encode('P6\n17 13\n255\n');
const image = new Uint8Array(header.length + 17 * 13 * 3);
image.set(header);
let seed = 31;
for (let i = header.length; i < image.length; ++i) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    image[i] = seed >>> 24;
}

function convert(policy, method, lookup = 'none') {
    return new Promise((resolve, reject) => {
        let fs;
        createConverter({
            arguments: ['--gpu-policy=' + policy, '--lookup-policy=' + lookup,
                '--precision-policy=8bit', '-d' + method, '-bxterm256',
                '-o', 'output.six', 'input.ppm'],
            preRun: [module => {
                fs = module.FS;
                fs.writeFile('input.ppm', image);
            }],
            onAbort: reason => reject(Error(String(reason))),
            onExit: status => {
                if (status) reject(Error(method + ' exited with ' + status));
                else resolve(fs.readFile('output.six'));
            }
        }).catch(reject);
    });
}

// Digests cover the whole SIXEL stream from the native Vulkan CLI using
// the same RGB888 fixture, palette, lookup and diffusion options.
const cases = [
    ['none', 'fs',
     '20b9ac9487e84ddaa8947848cc4998738431861b57e856405a9cc6496e4a9eee'],
    ['ordered', 'atkinson',
     '7b60ed5498c6b8f5002a8bcf78d1419ec14cef905dd6eb358ddc273bd74751f5'],
    ['5bit', 'burkes',
     '9a3258d0f9fda01b9c6b742edab09ba7c4b530a23118ba8860c563d15df24478'],
    ['6bit', 'sierra:variant=2',
     'aca631b033a26553d90298b091753cee65c09f603a3f4e24e664e60339bd0e33'],
    ['eytzinger', 'lso2',
     '04c8a50266857b79c1d9d0ada34bab4698a003bb2e3a55040787e77f0d933bef'],
    ['mahalanobis', 'jajuni',
     '76cf32fcf061c2ed06f0ae1b468d4a362661327771ffc48702e804cb62c7eff0'],
    ['vptree', 'stucki',
     '2852fbc3ba6df490b15f1e6aaaee92c5de9368a746acb868e02c835254785c5a'],
    ['rbc', 'sierra:variant=1',
     '610c5666cb8cb2c5dbe1cdef36e996ec5ad25ffe7a26c43d0ad52a3b2f0e187c'],
    ['certlut', 'sierra:variant=3',
     'eb9085a997622f920e2385a10f94e4cb2d8c93ff2e5166ad4c4b8245300dde26'],
    ['gridlut', 'fs',
     '20b9ac9487e84ddaa8947848cc4998738431861b57e856405a9cc6496e4a9eee'],
    ['delaunay', 'atkinson',
     '7b60ed5498c6b8f5002a8bcf78d1419ec14cef905dd6eb358ddc273bd74751f5'],
    ['blockcull', 'lso2:gain=small-error',
     '86a4529c928c80418d28585da516676a0fdc638c86f5b3c1463f7f6a71e0cc9e'],
    ['fhedt', 'lso2',
     '8d445e3d22cc9dc38fd90a244b467275f43a62e6188793b4613b0895fba51811'],
];

async function verify() {
    if (!await navigator.gpu?.requestAdapter())
        return 'ok 1 # SKIP no WebGPU adapter';
    const proto = GPUComputePassEncoder.prototype;
    const original = proto.dispatchWorkgroups;
    const map = GPUBuffer.prototype.mapAsync;
    const grids = [], reads = [];
    GPUBuffer.prototype.mapAsync = function (mode, ...args) {
        if (mode === GPUMapMode.READ) reads.push(this.size);
        return map.call(this, mode, ...args);
    };
    proto.dispatchWorkgroups = function (...args) {
        grids.push(args.slice(0, 2).join("x"));
        return original.apply(this, args);
    };
    try {
        for (const [lookup, method, expected] of cases) {
            const before = grids.length;
            reads.length = 0;
            const bytes = await convert('force', method, lookup);
            const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
            const hex = Array.from(digest, b => b.toString(16).padStart(2, '0')).join('');
            // Builders precede initialization. Point phases select one of
            // four 1024-position buckets; the collective keeps its 8x8 tile.
            const phases = grids.slice(-9, -1);
            const shape = lookup === 'blockcull' ? '3x2' : '16x1';
            // 221 indexes padded to a word plus the validation word.
            if (grids.length - before < 10 || !phases.every(g => g === shape) ||
                    reads.at(-1) !== 228 || hex !== expected)
                throw Error(lookup + '/' + method + ' dispatch or output differs');
        }
        return 'ok 1 - WebGPU diffusion matches Vulkan';
    } finally {
        GPUBuffer.prototype.mapAsync = map;
        proto.dispatchWorkgroups = original;
    }
}

const tap = document.getElementById('tap');
verify().then(result => tap.append(result + '\n'),
              error => tap.append('not ok 1 - ' + error + '\n'));
</script>
