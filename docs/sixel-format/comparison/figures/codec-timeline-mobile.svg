<svg xmlns="http://www.w3.org/2000/svg" width="380" height="986" viewBox="0 0 380 986" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Image formats and the terminal, 1971-2021</title>
<desc id="figure-description">A vertical timeline listing, oldest first: ECMA-35, ECMA-48, VT240, JPEG committee, VT340, GIF87a, GIF89a, JPEG T.81, PNG 1.0, JPEG 2000, RLogin 2.9.0, Gate One 1.0, libsixel and QOI.</desc>
