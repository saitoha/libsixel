<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="732" viewBox="0 0 1200 732" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Image formats and the terminal, 1971-2021</title>
<desc id="figure-description">A timeline from 1970 to 2025 with one row per event, oldest first: ECMA-35 1971, ECMA-48 1976, VT240 1984, JPEG committee 1986, VT340 1987, GIF87a 1987, GIF89a specification 1990, JPEG T.81 1992, PNG 1.0 1996, JPEG 2000 2000, RLogin 2.9.0 2010, Gate One 1.0 2012, libsixel 2014 and QOI 2021. Colors distinguish image formats, terminal standards or emulators, and SIXEL terminals or libraries.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1200.0" height="732.0" fill="#FFFFFF" stroke="none"/><text x="40.0" y="44.0" fill="#172033" font-size="28" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Image formats and the terminal, 1971-2021</text><text x="40.0" y="74.0" fill="#556176" font-size="17" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">One event per row, placed on a common year axis.</text><line x1="60.0" y1="98.0" x2="60.0" y2="642.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round"/><line x1="60.0" y1="636.0" x2="60.0" y2="648.0" stroke="#172033" stroke-width="2.0" stroke-linecap="round"/><text x="60.0" y="668.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1970</text><line x1="256.4" y1="98.0" x2="256.4" y2="642.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round"/><line x1="256.4" y1="636.0" x2="256.4" y2="648.0" stroke="#172033" stroke-width="2.0" stroke-linecap="round"/><text x="256.4" y="668.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1980</text><line x1="452.7" y1="98.0" x2="452.7" y2="642.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round"/><line x1="452.7" y1="636.0" x2="452.7" y2="648.0" stroke="#172033" stroke-width="2.0" stroke-linecap="round"/><text x="452.7" y="668.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1990</text><line x1="649.1" y1="98.0" x2="649.1" y2="642.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round"/><line x1="649.1" y1="636.0" x2="649.1" y2="648.0" stroke="#172033" stroke-width="2.0" stroke-linecap="round"/><text x="649.1" y="668.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2000</text><line x1="845.5" y1="98.0" x2="845.5" y2="642.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round"/><line x1="845.5" y1="636.0" x2="845.5" y2="648.0" stroke="#172033" stroke-width="2.0" stroke-linecap="round"/><text x="845.5" y="668.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2010</text><line x1="1041.8" y1="98.0" x2="1041.8" y2="642.0" stroke="#CBD5E1" stroke-width="1.0" stroke-linecap="round"/><line x1="1041.8" y1="636.0" x2="1041.8" y2="648.0" stroke="#172033" stroke-width="2.0" stroke-linecap="round"/><text x="1041.8" y="668.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2020</text><line x1="60.0" y1="642.0" x2="1140.0" y2="642.0" stroke="#172033" stroke-width="2.0" stroke-linecap="round"/><circle cx="97.3" cy="118.0" r="7" fill="#2563EB"/><text x="111.3" y="124.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1971 ECMA-35 - code extension (ISO 2022)</text><circle cx="181.7" cy="156.0" r="7" fill="#2563EB"/><text x="195.7" y="162.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1976 ECMA-48 - control functions, DCS/ST</text><circle cx="334.9" cy="194.0" r="7" fill="#0F766E"/><text x="348.9" y="200.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1984 VT240 - SIXEL on a DEC screen</text><circle cx="390.9" cy="232.0" r="7" fill="#D97706"/><text x="404.9" y="238.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1986 JPEG committee - ISDN photo-videotex</text><circle cx="399.7" cy="270.0" r="7" fill="#0F766E"/><text x="413.7" y="276.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1987 VT340 - color SIXEL terminal</text><circle cx="402.7" cy="308.0" r="7" fill="#D97706"/><text x="416.7" y="314.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1987 GIF87a - CompuServe VIDTEX</text><circle cx="464.1" cy="346.0" r="7" fill="#D97706"/><text x="478.1" y="352.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1990 GIF89a - ESC [ &gt; 0 g dialogue</text><circle cx="505.7" cy="384.0" r="7" fill="#D97706"/><text x="519.7" y="390.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1992 JPEG T.81 - telematic T series</text><circle cx="585.3" cy="422.0" r="7" fill="#D97706"/><text x="599.3" y="428.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1996 PNG 1.0 - signature detects damage</text><circle cx="666.8" cy="460.0" r="7" fill="#D97706"/><text x="680.8" y="466.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2000 JPEG 2000 - JP2 box may end at EOF</text><circle cx="859.2" cy="498.0" r="7" fill="#0F766E"/><text x="845.2" y="504.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">2010 RLogin 2.9.0 - SIXEL returns</text><circle cx="888.3" cy="536.0" r="7" fill="#2563EB"/><text x="874.3" y="542.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">2012 Gate One 1.0 - cat JPEG/PNG</text><circle cx="924.0" cy="574.0" r="7" fill="#0F766E"/><text x="910.0" y="580.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">2014 libsixel - library forms</text><circle cx="1079.1" cy="612.0" r="7" fill="#D97706"/><text x="1065.1" y="618.0" fill="#172033" font-size="16" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">2021 QOI - no entropy coding</text><circle cx="46.0" cy="702.0" r="6" fill="#D97706"/><text x="58.0" y="708.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Image format</text><circle cx="174.8" cy="702.0" r="6" fill="#2563EB"/><text x="186.8" y="708.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Terminal standard or emulator</text><circle cx="429.4" cy="702.0" r="6" fill="#0F766E"/><text x="441.4" y="708.0" fill="#556176" font-size="15" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SIXEL terminal or library</text>
</svg>
