   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(62.192969 32.994302)">median over 7 samples. Bars partition elapsed time by the work</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(70.863281 44.192115)">running in each interval; dotted lines join the ends of palette</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(58.846094 55.389927)">construction, lookup setup, the lookup and coding phase, and the</text>
