<svg xmlns="http://www.w3.org/2000/svg" width="380" height="820" viewBox="0 0 380 820" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">RGB primaries and reference whites</title>
<desc id="desc">CIE 1931 xy chromaticities from CSS Color 4, drawn at equal x/y scale. Solid blue is sRGB; dashed gold is Display P3. Both share D65 at (0.3127, 0.3290). D50 at (0.3457, 0.3585) is the ICC PCS reference. Triangle fill colors are categorical labels only.</desc>
<rect x="0" y="0" width="380" height="820" rx="0" fill="#ffffff" stroke="none"/>
<text x="20" y="36" font-size="20" fill="#183247" font-weight="700" text-anchor="start">Different primaries. The same white.</text>
<text x="20" y="66" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">sRGB and Display P3 in CIE 1931 xy</text>
