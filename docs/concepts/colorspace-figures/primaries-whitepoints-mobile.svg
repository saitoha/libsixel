<text x="24" y="478" font-size="17" fill="#183247" font-weight="700" text-anchor="start">1  Primaries define the RGB basis</text>
<text x="24" y="506" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Triangles join the red, green and blue</text>
<text x="24" y="529" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">primary chromaticities. P3 extends farther.</text>
<text x="24" y="572" font-size="17" fill="#183247" font-weight="700" text-anchor="start">2  D65 is the shared white point</text>
<text x="24" y="600" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Both spaces use D65 and the sRGB</text>
<text x="24" y="623" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">transfer function, but their primaries differ.</text>
<text x="24" y="666" font-size="17" fill="#183247" font-weight="700" text-anchor="start">3  D50 is the ICC PCS reference</text>
<text x="24" y="694" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Profile conversion accounts for the</text>
<text x="24" y="717" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">D50 / D65 change through color adaptation.</text>
<text x="20" y="757" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Axes are dimensionless; equal x/y scale.</text>
<text x="20" y="779" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Triangle fills identify spaces;</text>
<text x="20" y="801" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">they are not actual displayed colors.</text>
</svg>
