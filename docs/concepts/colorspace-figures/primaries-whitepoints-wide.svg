<text x="505" y="130" font-size="21" fill="#183247" font-weight="700" text-anchor="start">1  Primaries define the RGB basis</text>
<text x="505" y="158" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Triangles join the red, green and blue</text>
<text x="505" y="181" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">primary chromaticities. P3 extends farther.</text>
<text x="505" y="243" font-size="21" fill="#183247" font-weight="700" text-anchor="start">2  D65 is the shared white point</text>
<text x="505" y="271" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Both spaces use D65 and the sRGB</text>
<text x="505" y="294" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">transfer function, but their primaries differ.</text>
<text x="505" y="356" font-size="21" fill="#183247" font-weight="700" text-anchor="start">3  D50 is the ICC PCS reference</text>
<text x="505" y="384" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Profile conversion accounts for the</text>
<text x="505" y="407" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">D50 / D65 change through color adaptation.</text>
<text x="20" y="534" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">Axes are dimensionless; equal x/y scale.</text>
<text x="20" y="556" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">Triangle fills identify spaces, not actual displayed colors.</text>
</svg>
