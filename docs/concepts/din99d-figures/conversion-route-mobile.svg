<svg xmlns="http://www.w3.org/2000/svg" width="380" height="890" viewBox="0 0 380 890" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">The corrected sRGB to DIN99d conversion route</title>
<desc id="desc">sRGB decodes into linear RGB, which maps to D65 XYZ. The sample and reference-white X become 1.12 X minus 0.12 Z before the Lab-like stage. DIN99d reshapes lightness and chroma and stores every axis divided by 100. The inverse undoes the X correction before ordinary XYZ-to-RGB conversion.</desc>
<rect x="0" y="0" width="380" height="890" rx="0" fill="#ffffff" stroke="none"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#4c6070" stroke-width="1.3"/></marker></defs>
<text x="20" y="36" font-size="24" fill="#183247" font-weight="700" text-anchor="start">DIN99d begins before Lab</text>
<text x="20" y="65" font-size="13" fill="#4c6070" font-weight="400" text-anchor="start">The sample and its reference white change together.</text>
<path data-from="input" data-to="linear" d="M 190 199 L 190 232" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="linear" data-to="xyz" d="M 190 336 L 190 369" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="xyz" data-to="labprime" d="M 190 473 L 190 506" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="labprime" data-to="din" d="M 190 610 L 190 643" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="stage" data-stage="input">
<rect x="40" y="98" width="300" height="100" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="190" y="142.5" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">sRGB</text>
<text x="190" y="163.5" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">Encoded RGB values</text>
</g>
<g data-role="stage" data-stage="linear">
<rect x="40" y="235" width="300" height="100" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="190" y="279.5" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">Linear RGB</text>
<text x="190" y="300.5" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">Decode sRGB curve</text>
</g>
<g data-role="stage" data-stage="xyz">
<rect x="40" y="372" width="300" height="100" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="190" y="416.5" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">XYZ · D65</text>
<text x="190" y="437.5" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">RGB → XYZ matrix</text>
</g>
<g data-role="stage" data-stage="labprime">
<rect x="40" y="509" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="190" y="532.5" font-size="15" fill="#17618c" font-weight="700" text-anchor="middle">Corrected</text>
<text x="190" y="553.5" font-size="15" fill="#17618c" font-weight="700" text-anchor="middle">Lab-like values</text>
<text x="190" y="574.5" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">Correct X + white</text>
<text x="190" y="595.5" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">Apply Lab functions</text>
</g>
<g data-role="stage" data-stage="din">
<rect x="40" y="646" width="300" height="100" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="190" y="680" font-size="15" fill="#17618c" font-weight="700" text-anchor="middle">DIN99d</text>
<text x="190" y="701" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">Reshape L / chroma</text>
<text x="190" y="722" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">Divide all axes by 100</text>
</g>
<text x="20" y="772" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Sample: X′ = 1.12X − 0.12Z</text>
<text x="20" y="797" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">White: X′n = 1.12Xn − 0.12Zn</text>
<text x="20" y="822" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">The inverse restores X before returning to RGB.</text>
<text x="20" y="847" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">One divisor preserves relative axis weights.</text>
<text x="20" y="872" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Schematic stages, not image-buffer allocations.</text>
</svg>
