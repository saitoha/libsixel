<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1240" viewBox="0 0 960 1240" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Color conversion through the encoding pipeline</title>
<desc id="desc">The loader interprets bytes and optional CMS metadata. The frame carries pixels, format and color space. Optional default resize uses linear RGB. Palette sampling, conversion to -X and quantization produce palette entries, which enter -W to meet the main image view at lookup and dithering. Only final palette entries convert to -U; pixel indices keep their assignments. SIXEL writes both. The generated-palette branch is shown; fixed-palette shortcuts are omitted.</desc>
<rect x="0" y="0" width="960" height="1240" rx="0" fill="#ffffff" stroke="none"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#4c6070" stroke-width="1.3"/></marker></defs>
<text x="20" y="36" font-size="28" fill="#183247" font-weight="700" text-anchor="start">Where does each conversion act?</text>
<text x="20" y="65" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Follow image pixels and palette entries separately.</text>
<text x="724" y="610" font-size="18" fill="#4c6070" font-weight="400" text-anchor="middle">The two branches meet in -W.</text>
<text x="724" y="638" font-size="18" fill="#4c6070" font-weight="400" text-anchor="middle">Lookup and diffusion use</text>
<text x="724" y="666" font-size="18" fill="#4c6070" font-weight="400" text-anchor="middle">the same coordinate system.</text>
<path data-from="input" data-to="loader" d="M 297 153 L 341 153" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="loader" data-to="frame" d="M 617 153 L 661 153" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="frame" data-to="resize" d="M 800 199 L 800 228 L 480 228 L 480 253" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="resize" data-to="samples" d="M 480 333 L 480 359 L 236 359 L 236 395" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="resize" data-to="pixels" d="M 480 333 L 480 359 L 724 359 L 724 395" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="samples" data-to="cluster" d="M 236 475 L 236 507" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="cluster" data-to="quantize" d="M 236 587 L 236 619" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="quantize" data-to="palette" d="M 236 699 L 236 731" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="palette" data-to="lookup" d="M 236 811 L 236 837 L 480 837 L 480 861" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="pixels" data-to="lookup" d="M 724 475 L 724 500 L 920 500 L 920 837 L 480 837 L 480 861" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="lookup" data-to="output" d="M 480 941 L 480 967 L 236 967 L 236 991" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="lookup" data-to="indices" d="M 480 941 L 480 967 L 724 967 L 724 991" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="output" data-to="wire" d="M 236 1071 L 236 1097 L 480 1097 L 480 1121" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-from="indices" data-to="wire" d="M 724 1071 L 724 1097 L 480 1097 L 480 1121" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="stage" data-stage="input">
<rect x="24" y="108" width="272" height="90" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="160" y="146" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Encoded image</text>
<text x="160" y="170" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Bytes + metadata / ICC</text>
</g>
<g data-role="stage" data-stage="loader">
<rect x="344" y="108" width="272" height="90" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="480" y="134" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Image loader</text>
<text x="480" y="158" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Optional CMS</text>
<text x="480" y="182" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Source → cms_target</text>
</g>
<g data-role="stage" data-stage="frame">
<rect x="664" y="108" width="272" height="90" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="800" y="146" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Loaded frame</text>
<text x="800" y="170" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Pixels + format + color space</text>
</g>
<g data-role="stage" data-stage="resize">
<rect x="260" y="256" width="440" height="76" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="6 4"/>
<text x="480" y="287" font-size="20" fill="#17618c" font-weight="700" text-anchor="middle">Default resize, when requested</text>
<text x="480" y="311" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Linear RGB → resample → work format</text>
</g>
<g data-role="stage" data-stage="samples">
<rect x="32" y="398" width="408" height="76" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="236" y="429" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Palette-building view</text>
<text x="236" y="453" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Sampling / selected pixels</text>
</g>
<g data-role="stage" data-stage="pixels">
<rect x="520" y="398" width="408" height="76" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="724" y="429" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Main image view · -W</text>
<text x="724" y="453" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Convert image pixels as needed</text>
</g>
<g data-role="stage" data-stage="cluster">
<rect x="32" y="510" width="408" height="76" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="236" y="541" font-size="20" fill="#17618c" font-weight="700" text-anchor="middle">Clustering coordinates · -X</text>
<text x="236" y="565" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Convert the view as needed</text>
</g>
<g data-role="stage" data-stage="quantize">
<rect x="32" y="622" width="408" height="76" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="236" y="653" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Binning + quantizer</text>
<text x="236" y="677" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Generated palette entries in -X</text>
</g>
<g data-role="stage" data-stage="palette">
<rect x="32" y="734" width="408" height="76" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="236" y="765" font-size="20" fill="#17618c" font-weight="700" text-anchor="middle">Palette coordinates · -W</text>
<text x="236" y="789" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Convert entries: -X → -W</text>
</g>
<g data-role="stage" data-stage="lookup">
<rect x="260" y="864" width="440" height="76" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="480" y="895" font-size="20" fill="#17618c" font-weight="700" text-anchor="middle">Lookup + dithering · -W</text>
<text x="480" y="919" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Assign palette indices to pixels</text>
</g>
<g data-role="stage" data-stage="output">
<rect x="32" y="994" width="408" height="76" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="236" y="1025" font-size="20" fill="#17618c" font-weight="700" text-anchor="middle">Final palette entries · -U</text>
<text x="236" y="1049" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Convert entries: -W → -U</text>
</g>
<g data-role="stage" data-stage="indices">
<rect x="520" y="994" width="408" height="76" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="724" y="1025" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Palette indices</text>
<text x="724" y="1049" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Pixel-to-entry assignments stay the same</text>
</g>
<g data-role="stage" data-stage="wire">
<rect x="260" y="1124" width="440" height="76" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="480" y="1155" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">SIXEL stream</text>
<text x="480" y="1179" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Palette percentages + pixel indices</text>
</g>
<text x="20" y="1228" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">Generated-palette route; schematic contracts, not buffer allocations.</text>
</svg>
