<svg xmlns="http://www.w3.org/2000/svg" width="648" height="296" viewBox="0 0 648 296" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Two gray ramps</title>
<desc id="desc">Two rows of eleven gray patches from black to white. The upper row steps evenly in stored sRGB values and looks evenly spaced. The lower row steps evenly in light; most of its patches look light and the jump from black to the second patch is large. Numbers under the patches are the stored 8-bit values.</desc>
