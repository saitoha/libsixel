<svg xmlns="http://www.w3.org/2000/svg" width="656" height="476" viewBox="0 0 656 476" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Lightness step of one code value</title>
<desc id="desc">Lightness difference between neighboring 8-bit code values for linear coding, a 1.8 power, sRGB and a 2.4 power, on a logarithmic axis. Linear coding wastes steps far below visibility near white and jumps by several lightness units near black; the gamma encodings stay close to or below the visible step everywhere.</desc>
