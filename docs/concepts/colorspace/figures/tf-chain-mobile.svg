<svg xmlns="http://www.w3.org/2000/svg" width="376" height="596" viewBox="0 0 376 596" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">OETF, EOTF and OOTF</title>
<desc id="desc">Scene light passes through a camera opto-electronic transfer function into stored values, and a display electro-optical transfer function turns them back into light. The end-to-end opto-optical transfer function connects scene light to screen light.</desc>
<rect x="0" y="0" width="376" height="596" fill="#ffffff"/>
<g transform="translate(18 18)">
<rect x="40" y="20" width="220" height="58" fill="#eef2f6" stroke="#183247"/>
<text x="150" y="45" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">Scene light</text>
<text x="150" y="65" font-size="12" fill="#4c6070" font-weight="400" text-anchor="middle">what the camera saw</text>
<path d="M 150.0 78.0 L 150.0 118.0" stroke="#183247" stroke-width="1.5" fill="none"/>
<rect x="40" y="120" width="220" height="58" fill="#fdf1e7" stroke="#183247"/>
<text x="150" y="145" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">Camera OETF</text>
<text x="150" y="165" font-size="12" fill="#4c6070" font-weight="400" text-anchor="middle">e.g. BT.709</text>
<path d="M 150.0 178.0 L 150.0 218.0" stroke="#183247" stroke-width="1.5" fill="none"/>
<rect x="40" y="220" width="220" height="58" fill="#ffffff" stroke="#183247"/>
<text x="150" y="245" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">Stored values</text>
<text x="150" y="265" font-size="12" fill="#4c6070" font-weight="400" text-anchor="middle">pixels, files</text>
<path d="M 150.0 278.0 L 150.0 318.0" stroke="#183247" stroke-width="1.5" fill="none"/>
<rect x="40" y="320" width="220" height="58" fill="#fdf1e7" stroke="#183247"/>
<text x="150" y="345" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">Display EOTF</text>
<text x="150" y="365" font-size="12" fill="#4c6070" font-weight="400" text-anchor="middle">e.g. BT.1886, sRGB</text>
<path d="M 150.0 378.0 L 150.0 418.0" stroke="#183247" stroke-width="1.5" fill="none"/>
<rect x="40" y="420" width="220" height="58" fill="#eef2f6" stroke="#183247"/>
<text x="150" y="445" font-size="15" fill="#183247" font-weight="700" text-anchor="middle">Screen light</text>
<text x="150" y="465" font-size="12" fill="#4c6070" font-weight="400" text-anchor="middle">what the viewer sees</text>
<path d="M 290.0 49.0 L 290.0 449.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<text transform="rotate(90 305 250)" x="305" y="250" font-size="13" fill="#c0392b" font-weight="700" text-anchor="middle">OOTF</text>
</g>
</svg>
