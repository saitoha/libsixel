<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Lazy conversion before and after resize</title>
<desc id="desc">Case A: an opaque gamma RGB888 input is decoded to linear float for default resize, then encoded back to RGB888 for 8-bit gamma work. Case B: a linear float loader result enters resize without transfer decoding, then converts to Oklab float for -Woklab. The resize operation needs the same linear representation in both cases.</desc>
<rect x="0" y="0" width="960" height="570" rx="0" fill="#ffffff" stroke="none"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#4c6070" stroke-width="1.3"/></marker></defs>
<text x="20" y="35" font-size="28" fill="#183247" font-weight="700" text-anchor="start">Resize reveals the boundary</text>
<text x="20" y="65" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">The actual input format decides the conversions.</text>
<text x="20" y="105" font-size="21" fill="#183247" font-weight="700" text-anchor="start">A · Gamma input / gamma work</text>
<text x="20" y="130" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">--precision=8bit -Wgamma</text>
<g data-role="stage" data-stage="case-0-stage-0">
<rect x="24" y="155" width="220" height="96" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="134" y="196" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">RGB888</text>
<text x="134" y="220" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Gamma-encoded source</text>
</g>
<text x="307" y="178" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">decode sRGB</text>
<path data-from="case-0-stage-0" data-to="case-0-stage-1" d="M 245 203 L 367 203" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="stage" data-stage="case-0-stage-1">
<rect x="370" y="155" width="220" height="96" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="480" y="196" font-size="20" fill="#17618c" font-weight="700" text-anchor="middle">LINEARRGBFLOAT32</text>
<text x="480" y="220" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Resize in linear light</text>
</g>
<text x="653" y="178" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">encode sRGB</text>
<path data-from="case-0-stage-1" data-to="case-0-stage-2" d="M 591 203 L 713 203" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="stage" data-stage="case-0-stage-2">
<rect x="716" y="155" width="220" height="96" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="826" y="196" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">RGB888</text>
<text x="826" y="220" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Gamma work · -Wgamma</text>
</g>
<text x="20" y="327" font-size="21" fill="#183247" font-weight="700" text-anchor="start">B · Linear loader output / OKLab work</text>
<text x="20" y="352" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">Linear-light loader composition, then -Woklab</text>
<g data-role="stage" data-stage="case-1-stage-0">
<rect x="24" y="377" width="220" height="96" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="134" y="418" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">LINEARRGBFLOAT32</text>
<text x="134" y="442" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">From loader composition</text>
</g>
<text x="307" y="400" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">no decode</text>
<path data-from="case-1-stage-0" data-to="case-1-stage-1" d="M 245 425 L 367 425" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="stage" data-stage="case-1-stage-1">
<rect x="370" y="377" width="220" height="96" rx="10" fill="#eaf3f8" stroke="#17618c" stroke-dasharray="none"/>
<text x="480" y="418" font-size="20" fill="#17618c" font-weight="700" text-anchor="middle">LINEARRGBFLOAT32</text>
<text x="480" y="442" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Resize in linear light</text>
</g>
<text x="653" y="400" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">to OKLab</text>
<path data-from="case-1-stage-1" data-to="case-1-stage-2" d="M 591 425 L 713 425" fill="none" stroke="#4c6070" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="stage" data-stage="case-1-stage-2">
<rect x="716" y="377" width="220" height="96" rx="10" fill="#f5f7f9" stroke="#c4ced6" stroke-dasharray="none"/>
<text x="826" y="418" font-size="20" fill="#183247" font-weight="700" text-anchor="middle">Oklab float</text>
<text x="826" y="442" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">Perceptual work · -Woklab</text>
</g>
<text x="20" y="536" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">Default resize path, with conversion only at differing boundaries.</text>
<text x="20" y="558" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">Schematic examples; loaders may have additional CMS-target conversions.</text>
</svg>
