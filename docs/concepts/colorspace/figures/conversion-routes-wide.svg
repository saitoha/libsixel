<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Operation-dependent color conversion</title>
<desc id="desc">Four schematic routes show no-op gamma processing, linear-light mixing or resize, OKLab conversion via the combined XYZ-to-LMS matrices, and an ICC PCS D50 connection adapted toward D65 linear sRGB. Nodes do not imply separate image buffers. Loader composition is path-dependent; these are not all loader implementations.</desc>
<rect x="0" y="0" width="960" height="900" rx="0" fill="#ffffff" stroke="none"/>
<text x="20" y="35" font-size="28" fill="#183247" font-weight="700" text-anchor="start">Convert when the operation needs it</text>
<text x="20" y="65" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Four routes through the same color system</text>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#4c6070" stroke-width="1.3"/></marker></defs>
<g data-role="conversion-route" data-case="0">
<text x="20" y="106" font-size="21" fill="#183247" font-weight="700" text-anchor="start">A · No conversion needed</text>
<text x="20" y="132" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">No CMS, no mixing or resize; gamma work</text>
<circle cx="90" cy="191" r="16" fill="#edf0f3"/>
<circle cx="90" cy="191" r="5" fill="#4c6070"/>
<text x="90" y="165" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">sRGB input</text>
<path d="M 110 191 L 848 191" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="223" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">keep the same coordinates</text>
<circle cx="870" cy="191" r="16" fill="#edf0f3"/>
<circle cx="870" cy="191" r="5" fill="#4c6070"/>
<text x="870" y="165" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">sRGB work</text>
<text x="20" y="254" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">No linear image buffer is needed for this route.</text>
</g>
<g data-role="conversion-route" data-case="1">
<text x="20" y="291" font-size="21" fill="#183247" font-weight="700" text-anchor="start">B · Mix light only when needed</text>
<text x="20" y="317" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Linear composition / default resize; gamma work</text>
<circle cx="90" cy="376" r="16" fill="#edf0f3"/>
<circle cx="90" cy="376" r="5" fill="#4c6070"/>
<text x="90" y="350" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">sRGB input</text>
<path d="M 110 376 L 328 376" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="220" y="408" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">decode sRGB</text>
<circle cx="350" cy="376" r="16" fill="#dfedf4"/>
<circle cx="350" cy="376" r="5" fill="#17618c"/>
<text x="350" y="350" font-size="18" fill="#17618c" font-weight="700" text-anchor="middle">linear RGB</text>
<path d="M 370 376 L 588 376" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="408" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">linear-light math</text>
<circle cx="610" cy="376" r="16" fill="#edf0f3"/>
<circle cx="610" cy="376" r="5" fill="#4c6070"/>
<text x="610" y="350" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">Mix / resize</text>
<path d="M 630 376 L 848 376" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="740" y="408" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">encode sRGB</text>
<circle cx="870" cy="376" r="16" fill="#edf0f3"/>
<circle cx="870" cy="376" r="5" fill="#4c6070"/>
<text x="870" y="350" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">sRGB work</text>
<text x="20" y="439" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">A linear loader result can skip the first conversion.</text>
</g>
<g data-role="conversion-route" data-case="2">
<text x="20" y="476" font-size="21" fill="#183247" font-weight="700" text-anchor="start">C · Enter a perceptual space</text>
<text x="20" y="502" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">OKLab palette processing, even without mixing</text>
<circle cx="90" cy="561" r="16" fill="#edf0f3"/>
<circle cx="90" cy="561" r="5" fill="#4c6070"/>
<text x="90" y="535" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">sRGB input</text>
<path d="M 110 561 L 328 561" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="220" y="593" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">decode sRGB</text>
<circle cx="350" cy="561" r="16" fill="#dfedf4"/>
<circle cx="350" cy="561" r="5" fill="#17618c"/>
<text x="350" y="535" font-size="18" fill="#17618c" font-weight="700" text-anchor="middle">linear RGB</text>
<path d="M 370 561 L 588 561" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="593" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">XYZ matrices combined</text>
<circle cx="610" cy="561" r="16" fill="#edf0f3"/>
<circle cx="610" cy="561" r="5" fill="#4c6070"/>
<text x="610" y="535" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">LMS</text>
<path d="M 630 561 L 848 561" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="740" y="593" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">cube roots + matrix</text>
<circle cx="870" cy="561" r="16" fill="#edf0f3"/>
<circle cx="870" cy="561" r="5" fill="#4c6070"/>
<text x="870" y="535" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">OKLab</text>
<text x="20" y="624" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">LMS approximates cone responses; a separate XYZ image is unnecessary.</text>
</g>
<g data-role="conversion-route" data-case="3">
<text x="20" y="661" font-size="21" fill="#183247" font-weight="700" text-anchor="start">D · Connect an ICC source profile</text>
<text x="20" y="687" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Conceptual source-to-linear-sRGB normalization</text>
<circle cx="90" cy="746" r="16" fill="#edf0f3"/>
<circle cx="90" cy="746" r="5" fill="#4c6070"/>
<text x="90" y="720" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">Input values</text>
<path d="M 110 746 L 263 746" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="187.5" y="778" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">source profile</text>
<circle cx="285" cy="746" r="16" fill="#dfedf4"/>
<circle cx="285" cy="746" r="5" fill="#17618c"/>
<text x="285" y="720" font-size="18" fill="#17618c" font-weight="700" text-anchor="middle">PCS · D50</text>
<path d="M 305 746 L 458 746" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="382.5" y="778" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">XYZ + adaptation</text>
<circle cx="480" cy="746" r="16" fill="#edf0f3"/>
<circle cx="480" cy="746" r="5" fill="#4c6070"/>
<text x="480" y="720" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">XYZ · D65</text>
<path d="M 500 746 L 653 746" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="577.5" y="778" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">RGB matrix</text>
<circle cx="675" cy="746" r="16" fill="#dfedf4"/>
<circle cx="675" cy="746" r="5" fill="#17618c"/>
<text x="675" y="720" font-size="18" fill="#17618c" font-weight="700" text-anchor="middle">linear RGB</text>
<path d="M 695 746 L 848 746" stroke="#4c6070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="772.5" y="778" font-size="17" fill="#4c6070" font-weight="400" text-anchor="middle">linear-light math</text>
<circle cx="870" cy="746" r="16" fill="#edf0f3"/>
<circle cx="870" cy="746" r="5" fill="#4c6070"/>
<text x="870" y="720" font-size="18" fill="#183247" font-weight="700" text-anchor="middle">Mix light</text>
<text x="20" y="809" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">PCS uses XYZ or Lab; it connects profiles, not processing stages.</text>
</g>
<text x="20" y="858" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">Schematic routes, not buffer allocations or timing measurements.</text>
<text x="20" y="881" font-size="17" fill="#4c6070" font-weight="400" text-anchor="start">PCS: XYZ or Lab at D50. Linear RGB: the internal sRGB basis.</text>
</svg>
