<text x="53" y="369" font-size="12" fill="#4c6070" font-weight="400" text-anchor="end">0.2</text>
<path d="M 60.0 211.7 L 520.0 211.7" stroke="#d9e1e7" stroke-width="1" fill="none"/>
<text x="53" y="215.667" font-size="12" fill="#4c6070" font-weight="400" text-anchor="end">0.4</text>
