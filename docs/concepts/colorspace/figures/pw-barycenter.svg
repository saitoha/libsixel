<svg xmlns="http://www.w3.org/2000/svg" width="596" height="596" viewBox="0 0 596 596" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">White as the balance point of the primaries</title>
<desc id="desc">The sRGB primaries in the xy diagram with circles sized by the share of X + Y + Z each contributes to white. D65 is their weighted center: blue contributes the largest share of X + Y + Z although it adds the least luminance.</desc>
