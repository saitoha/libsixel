<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1450" viewBox="0 0 760 1450" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">When is a palette register resolved?</title>
<desc id="figure-description">Mobile diagram comparing live-register and paint-time terminal rendering after register zero changes from red to blue.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="760.0" height="1450.0" fill="#F8FAFC" stroke="none"/>
<text x="38.0" y="58.0" fill="#172033" font-size="38" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">When is #0 resolved?</text>
<text x="38.0" y="92.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The same stream can produce two results.</text>
<rect x="85.0" y="145.0" width="110.0" height="42.0" rx="12.0" fill="#BE185D" stroke="none"/><text x="140.0" y="173.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">#0 red</text>
<line x1="205.0" y1="166.0" x2="255.0" y2="166.0" stroke="#BE185D" stroke-width="4.0" stroke-linecap="round" marker-end="url(#arrow-magenta)"/>
<rect x="265.0" y="145.0" width="92.0" height="42.0" rx="12.0" fill="#172033" stroke="none"/><text x="311.0" y="173.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">paint</text>
<line x1="367.0" y1="166.0" x2="417.0" y2="166.0" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="427.0" y="145.0" width="120.0" height="42.0" rx="12.0" fill="#2563EB" stroke="none"/><text x="487.0" y="173.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">#0 blue</text>
<line x1="557.0" y1="166.0" x2="607.0" y2="166.0" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="617.0" y="145.0" width="92.0" height="42.0" rx="12.0" fill="#172033" stroke="none"/><text x="663.0" y="173.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">paint</text>
<rect x="55.0" y="245.0" width="650.0" height="440.0" rx="18.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0"/><rect x="55.0" y="245.0" width="8.0" height="440.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="83.0" y="287.0" fill="#BE185D" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Live register: high color fails</text>
<text x="95.0" y="325.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Earlier pixels still point at #0.</text><text x="95.0" y="354.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Redefining #0 changes them too.</text>
<rect x="230.0" y="430.0" width="90.0" height="90.0" rx="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="3.0"/><rect x="340.0" y="430.0" width="90.0" height="90.0" rx="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="3.0"/>
<text x="330.0" y="555.0" fill="#BE185D" font-size="20" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">both blue</text>
<line x1="380.0" y1="700.0" x2="380.0" y2="745.0" stroke="#0F766E" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="55.0" y="755.0" width="650.0" height="440.0" rx="18.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0"/><rect x="55.0" y="755.0" width="8.0" height="440.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="83.0" y="797.0" fill="#0F766E" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Paint time: high color works</text>
<text x="95.0" y="835.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Each paint captures the current RGB.</text><text x="95.0" y="864.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Later definitions do not rewrite it.</text>
<rect x="230.0" y="940.0" width="90.0" height="90.0" rx="10.0" fill="#BE185D" stroke="#FFFFFF" stroke-width="3.0"/><rect x="340.0" y="940.0" width="90.0" height="90.0" rx="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="3.0"/>
<text x="330.0" y="1065.0" fill="#0F766E" font-size="20" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">red, then blue</text>
<rect x="85.0" y="1260.0" width="590.0" height="100.0" rx="14.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="380.0" y="1302.0" fill="#172033" font-size="20" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Check terminal support before using -I.</text>
<text x="380.0" y="1334.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The historical DEC model is the upper case.</text>
</svg>
