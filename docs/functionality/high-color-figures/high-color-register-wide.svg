<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">High color depends on register resolution timing</title>
<desc id="figure-description">The same register zero is red for the first paint and blue for the second. A live-register display turns both pixels blue; a paint-time display preserves the first red pixel, enabling high color.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1440.0" height="760.0" fill="#F8FAFC" stroke="none"/>
<text x="55.0" y="62.0" fill="#172033" font-size="38" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">High color depends on when a terminal resolves a register</text>
<text x="55.0" y="100.0" fill="#556176" font-size="20" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The stream paints with #0, redefines #0, and paints again.</text>
<rect x="95.0" y="155.0" width="130.0" height="42.0" rx="12.0" fill="#BE185D" stroke="none"/><text x="160.0" y="183.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">#0 = red</text>
<line x1="235.0" y1="176.0" x2="305.0" y2="176.0" stroke="#BE185D" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-magenta)"/>
<rect x="315.0" y="155.0" width="130.0" height="42.0" rx="12.0" fill="#172033" stroke="none"/><text x="380.0" y="183.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">paint left</text>
<line x1="455.0" y1="176.0" x2="525.0" y2="176.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="535.0" y="155.0" width="140.0" height="42.0" rx="12.0" fill="#2563EB" stroke="none"/><text x="605.0" y="183.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">#0 = blue</text>
<line x1="685.0" y1="176.0" x2="755.0" y2="176.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="765.0" y="155.0" width="145.0" height="42.0" rx="12.0" fill="#172033" stroke="none"/><text x="837.5" y="183.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">paint right</text>
<line x1="920.0" y1="176.0" x2="990.0" y2="176.0" stroke="#D97706" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<text x="1020.0" y="183.0" fill="#556176" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">same wire events</text>
<rect x="55.0" y="260.0" width="635.0" height="365.0" rx="18.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0"/><rect x="55.0" y="260.0" width="8.0" height="365.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="83.0" y="302.0" fill="#BE185D" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Live-register display</text>
<text x="95.0" y="330.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Earlier pixels retain register #0,</text><text x="95.0" y="358.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">not the red value it had then.</text>
<rect x="125.0" y="415.0" width="90.0" height="90.0" rx="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="3.0"/><rect x="235.0" y="415.0" width="90.0" height="90.0" rx="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="3.0"/>
<text x="225.0" y="545.0" fill="#BE185D" font-size="19" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">left changes to blue</text>
<text x="555.0" y="455.0" fill="#BE185D" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">VT340-like</text>
<text x="555.0" y="486.0" fill="#BE185D" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">high color fails</text>
<rect x="750.0" y="260.0" width="635.0" height="365.0" rx="18.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0"/><rect x="750.0" y="260.0" width="8.0" height="365.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="778.0" y="302.0" fill="#0F766E" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Paint-time display</text>
<text x="790.0" y="330.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Each paint operation resolves #0</text><text x="790.0" y="358.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">to its current RGB value immediately.</text>
<rect x="820.0" y="415.0" width="90.0" height="90.0" rx="10.0" fill="#BE185D" stroke="#FFFFFF" stroke-width="3.0"/><rect x="930.0" y="415.0" width="90.0" height="90.0" rx="10.0" fill="#2563EB" stroke="#FFFFFF" stroke-width="3.0"/>
<text x="920.0" y="545.0" fill="#0F766E" font-size="19" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">red stays red</text>
<text x="1250.0" y="455.0" fill="#0F766E" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">modern behavior</text>
<text x="1250.0" y="486.0" fill="#0F766E" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">high color works</text>
<rect x="180.0" y="665.0" width="1080.0" height="55.0" rx="13.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="720.0" y="700.0" fill="#172033" font-size="20" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">-I is a terminal-compatibility extension, not a guarantee of the DEC hardware model.</text>
</svg>
