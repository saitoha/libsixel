<rect x="430.0" y="235.0" width="120.0" height="42.0" rx="12.0" fill="#BE185D" stroke="none"/><text x="490.0" y="263.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">R: 5 bits</text>
<rect x="430.0" y="300.0" width="120.0" height="42.0" rx="12.0" fill="#0F766E" stroke="none"/><text x="490.0" y="328.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">G: 5 bits</text>
<rect x="430.0" y="365.0" width="120.0" height="42.0" rx="12.0" fill="#2563EB" stroke="none"/><text x="490.0" y="393.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">B: 5 bits</text>
<text x="430.0" y="455.0" fill="#0F766E" font-size="24" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">32³ = 32,768</text>
<text x="430.0" y="490.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">possible colors</text>
<line x1="670.0" y1="345.0" x2="730.0" y2="345.0" stroke="#0F766E" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="740.0" y="150.0" width="320.0" height="390.0" rx="18.0" fill="#FEF3C7" stroke="#D97706" stroke-width="2.0"/><rect x="740.0" y="150.0" width="8.0" height="390.0" rx="4.0" fill="#D97706" stroke="none"/><text x="768.0" y="192.0" fill="#D97706" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3  Fill one pass</text>
<rect x="780.0" y="230.0" width="160.0" height="42.0" rx="12.0" fill="#D97706" stroke="none"/><text x="860.0" y="258.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">#0 … #254</text>
<text x="780.0" y="305.0" fill="#172033" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">assign up to 255 colors</text>
<text x="780.0" y="342.0" fill="#172033" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">paint matching cells</text>
<text x="780.0" y="379.0" fill="#172033" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">mark them complete</text>
<rect x="780.0" y="430.0" width="160.0" height="42.0" rx="12.0" fill="#172033" stroke="none"/><text x="860.0" y="458.0" fill="#FFFFFF" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">#255 = skip</text>
<line x1="1065.0" y1="345.0" x2="1125.0" y2="345.0" stroke="#D97706" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<rect x="1135.0" y="150.0" width="330.0" height="390.0" rx="18.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0"/><rect x="1135.0" y="150.0" width="8.0" height="390.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="1163.0" y="192.0" fill="#BE185D" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">4  Reuse and repeat</text>
<text x="1175.0" y="235.0" fill="#BE185D" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">redefine used registers</text>
<text x="1175.0" y="275.0" fill="#BE185D" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">paint remaining cells</text>
<text x="1175.0" y="315.0" fill="#BE185D" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">repeat until no dirty</text>
<path d="M 1300 380 V 455 H 1095 V 570 H 900 V 548" fill="none" stroke="#BE185D" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-magenta)"/>
<text x="1150.0" y="430.0" fill="#BE185D" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">another pass</text>
<rect x="120.0" y="605.0" width="1280.0" height="110.0" rx="15.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="760.0" y="647.0" fill="#172033" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">More colors mean more palette definitions and more passes.</text>
<text x="760.0" y="682.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">That raises stream size, while bypassing fixed-palette construction and lookup can reduce encoder CPU time.</text>
<text x="55.0" y="758.0" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Conceptual loop • the exact pass boundary follows register availability and already-painted marks</text>
</svg>
