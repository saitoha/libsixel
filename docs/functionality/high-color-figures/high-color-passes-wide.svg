<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="790" viewBox="0 0 1520 790" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">High color uses repeated 255-slot passes</title>
<desc id="figure-description">RGB pixels are reduced to five bits per channel, assigned to palette registers zero through 254, painted and marked, then remaining colors are emitted in later passes while register 255 remains a skip key.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1520.0" height="790.0" fill="#F8FAFC" stroke="none"/>
<text x="55.0" y="62.0" fill="#172033" font-size="38" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">-I turns a 15-bit color field into repeated 255-slot passes</text>
<text x="55.0" y="100.0" fill="#556176" font-size="20" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Five bits per channel create 32 × 32 × 32 possible RGB values; register #255 remains the skip key.</text>
