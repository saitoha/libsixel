<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1570" viewBox="0 0 760 1570" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">High color uses 255 palette slots at a time</title>
<desc id="figure-description">Mobile pipeline from RGB pixels through five-bit channel quantization, one 255-color paint pass, marking, register reuse, and repetition.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="760.0" height="1570.0" fill="#F8FAFC" stroke="none"/>
<text x="38.0" y="58.0" fill="#172033" font-size="35" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">15-bit color, 255 slots at a time</text>
<text x="38.0" y="92.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">#255 is kept as the skip key.</text>
<rect x="55.0" y="135.0" width="650.0" height="155.0" rx="18.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/><rect x="55.0" y="135.0" width="8.0" height="155.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="83.0" y="177.0" fill="#2563EB" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1  Normalize RGB</text><text x="83.0" y="217.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Source pixels enter as RGB888.</text><text x="83.0" y="243.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">High color bypasses palette construction.</text>
<rect x="500.0" y="190.0" width="20.0" height="20.0" rx="2.0" fill="#000000" stroke="none"/><rect x="522.0" y="190.0" width="20.0" height="20.0" rx="2.0" fill="#250B35" stroke="none"/><rect x="544.0" y="190.0" width="20.0" height="20.0" rx="2.0" fill="#4A166A" stroke="none"/><rect x="566.0" y="190.0" width="20.0" height="20.0" rx="2.0" fill="#6F219F" stroke="none"/><rect x="588.0" y="190.0" width="20.0" height="20.0" rx="2.0" fill="#942CD4" stroke="none"/><rect x="610.0" y="190.0" width="20.0" height="20.0" rx="2.0" fill="#B93709" stroke="none"/><rect x="500.0" y="212.0" width="20.0" height="20.0" rx="2.0" fill="#132F07" stroke="none"/><rect x="522.0" y="212.0" width="20.0" height="20.0" rx="2.0" fill="#383A3C" stroke="none"/><rect x="544.0" y="212.0" width="20.0" height="20.0" rx="2.0" fill="#5D4571" stroke="none"/><rect x="566.0" y="212.0" width="20.0" height="20.0" rx="2.0" fill="#8250A6" stroke="none"/><rect x="588.0" y="212.0" width="20.0" height="20.0" rx="2.0" fill="#A75BDB" stroke="none"/><rect x="610.0" y="212.0" width="20.0" height="20.0" rx="2.0" fill="#CC6610" stroke="none"/><rect x="500.0" y="234.0" width="20.0" height="20.0" rx="2.0" fill="#265E0E" stroke="none"/><rect x="522.0" y="234.0" width="20.0" height="20.0" rx="2.0" fill="#4B6943" stroke="none"/><rect x="544.0" y="234.0" width="20.0" height="20.0" rx="2.0" fill="#707478" stroke="none"/><rect x="566.0" y="234.0" width="20.0" height="20.0" rx="2.0" fill="#957FAD" stroke="none"/><rect x="588.0" y="234.0" width="20.0" height="20.0" rx="2.0" fill="#BA8AE2" stroke="none"/><rect x="610.0" y="234.0" width="20.0" height="20.0" rx="2.0" fill="#DF9517" stroke="none"/><rect x="500.0" y="256.0" width="20.0" height="20.0" rx="2.0" fill="#398D15" stroke="none"/><rect x="522.0" y="256.0" width="20.0" height="20.0" rx="2.0" fill="#5E984A" stroke="none"/><rect x="544.0" y="256.0" width="20.0" height="20.0" rx="2.0" fill="#83A37F" stroke="none"/><rect x="566.0" y="256.0" width="20.0" height="20.0" rx="2.0" fill="#A8AEB4" stroke="none"/><rect x="588.0" y="256.0" width="20.0" height="20.0" rx="2.0" fill="#CDB9E9" stroke="none"/><rect x="610.0" y="256.0" width="20.0" height="20.0" rx="2.0" fill="#F2C41E" stroke="none"/>
<line x1="380.0" y1="300.0" x2="380.0" y2="345.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="55.0" y="355.0" width="650.0" height="155.0" rx="18.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.0"/><rect x="55.0" y="355.0" width="8.0" height="155.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="83.0" y="397.0" fill="#0F766E" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2  Keep five bits per channel</text><text x="83.0" y="437.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">R5 + G5 + B5 = 15 bits</text><text x="83.0" y="463.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">32³ = 32,768 possible colors</text>
<line x1="380.0" y1="520.0" x2="380.0" y2="565.0" stroke="#0F766E" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="55.0" y="575.0" width="650.0" height="155.0" rx="18.0" fill="#FEF3C7" stroke="#D97706" stroke-width="2.0"/><rect x="55.0" y="575.0" width="8.0" height="155.0" rx="4.0" fill="#D97706" stroke="none"/><text x="83.0" y="617.0" fill="#D97706" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3  Build one paint pass</text><text x="83.0" y="657.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Assign up to 255 new colors to #0…#254.</text><text x="83.0" y="683.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Other pixels use #255 and wait.</text>
<line x1="380.0" y1="740.0" x2="380.0" y2="785.0" stroke="#D97706" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<rect x="55.0" y="795.0" width="650.0" height="155.0" rx="18.0" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.0"/><rect x="55.0" y="795.0" width="8.0" height="155.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="83.0" y="837.0" fill="#BE185D" font-size="23" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">4  Paint and mark</text><text x="83.0" y="877.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Emit changed definitions and matching cells.</text><text x="83.0" y="903.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Marked cells will not be painted again.</text>
<path d="M 380 960 V 1010 H 695 V 575" fill="none" stroke="#BE185D" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-magenta)"/>
<text x="495.0" y="995.0" fill="#BE185D" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">reuse slots for remaining colors</text>
<rect x="75.0" y="1095.0" width="610.0" height="225.0" rx="15.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="380.0" y="1140.0" fill="#172033" font-size="23" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tradeoff</text>
<text x="115.0" y="1185.0" fill="#0F766E" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">+ bypasses fixed-palette construction and lookup</text>
<text x="115.0" y="1225.0" fill="#0F766E" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">+ offers a 32,768-color lattice</text>
<text x="115.0" y="1265.0" fill="#BE185D" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">− repeats palette definitions and paint passes</text>
<rect x="75.0" y="1370.0" width="610.0" height="100.0" rx="15.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="1.5"/>
<text x="380.0" y="1412.0" fill="#BE185D" font-size="20" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Requires paint-time register semantics</text>
<text x="380.0" y="1444.0" fill="#556176" font-size="18" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">in the receiving terminal.</text>
</svg>
