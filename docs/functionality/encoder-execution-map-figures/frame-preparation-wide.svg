<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1070" viewBox="0 0 1760 1070" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Loader handoff and frame preparation</title>
<desc id="figure-description">Ordered loader candidates run their own decode, color management, orientation, and alpha handling. A frame records pixels, pixel format, color space, timing, palette metadata, and transparency metadata. Adaptive sampling reads the loaded frame before preprocessing; full-frame sampling borrows the preprocessed frame after optional clip, color conversion, resize, late clip, and post-resize conversion.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1760.0" height="5000.0" fill="#F8FAFC" stroke="none"/>
