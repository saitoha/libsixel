<text x="42.0" y="92.0" fill="#556176" font-size="19" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Fallback is ordered; CMS and alpha work are backend-local</text>
<text x="1718.0" y="60.0" fill="#2563EB" font-size="15" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">IMPLEMENTATION MAP 2 / 4</text>
