<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="990" viewBox="0 0 1760 990" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">The per-frame encoder scheduler</title>
<desc id="figure-description">The six macro scheduler nodes run on the caller thread. Only a conditional palette worker overlaps palette construction with preprocessing. Replan rebuilds the planner description before scheduling and is not a runtime rescheduler. Loader handoff and palette-apply-to-encode bands are separate concurrency domains.</desc>
