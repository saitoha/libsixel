<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1210" viewBox="0 0 1760 1210" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Generated palette construction</title>
<desc id="figure-description">Samples form a typed stream, are converted to the clustering color space, binned, and dispatched to one of four solver families with different initialization and iteration behavior. Optional final merge and snap happen in solver-specific construction, cover repair follows, then the palette is converted from clustering to working color space and may receive a reserved transparency key.</desc>
