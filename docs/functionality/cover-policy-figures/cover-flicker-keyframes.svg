<text x="60.0" y="58.0" fill="#172033" font-size="32" font-weight="700" font-family="system-ui, sans-serif" text-anchor="start">A stable source color can flicker when its palette neighborhood moves</text>
<text x="60.0" y="95.0" fill="#556176" font-size="19" font-weight="400" font-family="system-ui, sans-serif" text-anchor="start">Four schematic frames from a cross-dissolve. The red badge is constant in the source.</text>
