<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="920" viewBox="0 0 1540 920" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Parallel decoder validation and fallback</title>
<desc id="figure-description">After a serial anchor, byte spans are scanned in parallel. Only ordered disjoint row ranges cross an all-ready barrier into parallel paint; overlap or setup failure returns to clean serial paint.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1540.0" height="920.0" fill="#F8FAFC" stroke="none"/>
<text x="45.0" y="62.0" fill="#172033" font-size="38" font-weight="820" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Parallel paint is earned by a validation pass</text>
<text x="45.0" y="96.0" fill="#556176" font-size="20" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Arbitrary byte spans are useful only after their row ownership is known</text>
<rect x="65.0" y="150.0" width="280.0" height="130.0" rx="16.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="65.0" y="150.0" width="8.0" height="130.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="90.0" y="193.0" fill="#2563EB" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Serial anchor</text><text x="90.0" y="228.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">establish raster</text><text x="90.0" y="253.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">and initial palette</text>
<line x1="345.0" y1="215.0" x2="425.0" y2="215.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="430.0" y="150.0" width="280.0" height="130.0" rx="16.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="430.0" y="150.0" width="8.0" height="130.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="455.0" y="193.0" fill="#2563EB" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Byte spans</text><text x="455.0" y="228.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">split remaining input</text><text x="455.0" y="253.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">advance to band boundary</text>
<line x1="710.0" y1="215.0" x2="790.0" y2="215.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="795.0" y="150.0" width="300.0" height="130.0" rx="16.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="795.0" y="150.0" width="8.0" height="130.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="820.0" y="193.0" fill="#BE185D" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Parallel scan</text><text x="820.0" y="228.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">validate controls</text><text x="820.0" y="253.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">derive painted rows</text>
<line x1="1095.0" y1="215.0" x2="1175.0" y2="215.0" stroke="#BE185D" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-magenta)"/>
<rect x="1180.0" y="150.0" width="295.0" height="130.0" rx="16.0" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="1180.0" y="150.0" width="8.0" height="130.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="1205.0" y="193.0" fill="#BE185D" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Ownership check</text><text x="1205.0" y="228.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ordered?</text><text x="1205.0" y="253.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">row ranges disjoint?</text>
<path d="M 1328 280 V 385 H 1080" fill="none" stroke="#0F766E" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="1210.0" y="365.0" fill="#0F766E" font-size="17" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">yes</text>
<rect x="760.0" y="385.0" width="320.0" height="130.0" rx="16.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="760.0" y="385.0" width="8.0" height="130.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="785.0" y="428.0" fill="#0F766E" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">All-ready barrier</text><text x="785.0" y="463.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">create every worker</text><text x="785.0" y="488.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">release as one group</text>
<line x1="760.0" y1="450.0" x2="680.0" y2="450.0" stroke="#0F766E" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="360.0" y="385.0" width="320.0" height="130.0" rx="16.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="360.0" y="385.0" width="8.0" height="130.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="385.0" y="428.0" fill="#0F766E" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Parallel paint</text><text x="385.0" y="463.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">one row range per worker</text><text x="385.0" y="488.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">no shared-row locks</text>
<path d="M 1328 280 V 640 H 1070" fill="none" stroke="#D97706" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)"/>
<text x="1220.0" y="620.0" fill="#D97706" font-size="17" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">no / setup failure</text>
<rect x="720.0" y="640.0" width="350.0" height="140.0" rx="16.0" fill="#FEF3C7" stroke="#D97706" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="720.0" y="640.0" width="8.0" height="140.0" rx="4.0" fill="#D97706" stroke="none"/><text x="745.0" y="683.0" fill="#D97706" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Clean serial fallback</text><text x="745.0" y="718.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">join blocked workers</text><text x="745.0" y="743.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">discard partial setup</text><text x="745.0" y="768.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">paint once serially</text>
<path d="M 360 450 H 190 V 825 H 720" fill="none" stroke="#0F766E" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<line x1="895.0" y1="780.0" x2="895.0" y2="825.0" stroke="#D97706" stroke-width="4.0" stroke-linecap="round" marker-end="url(#arrow-gold)"/>
<rect x="720.0" y="825.0" width="350.0" height="38.0" rx="19.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="895.0" y="851.0" fill="#2563EB" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">one decoded image</text>
<rect x="65.0" y="640.0" width="520.0" height="140.0" rx="16.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="90.0" y="682.0" fill="#172033" font-size="21" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Performance rule</text>
<text x="90.0" y="720.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Scan and scheduling are overhead.</text><text x="90.0" y="747.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Small inputs can be faster on the serial path.</text>
</svg>
