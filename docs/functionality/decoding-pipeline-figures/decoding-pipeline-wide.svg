<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="760" viewBox="0 0 1640 760" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">SIXEL decoding mental model</title>
<desc id="figure-description">SIXEL bytes flow through a stateful parser and canvas painter, then branch through representation and output policy to caller pixels or PNG output.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1640.0" height="760.0" fill="#F8FAFC" stroke="none"/>
<text x="46.0" y="64.0" fill="#172033" font-size="40" font-weight="820" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SIXEL is a paint program, not a pixel dump</text>
<text x="46.0" y="98.0" fill="#556176" font-size="20" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Decode state turns protocol commands into a raster contract</text>
<text x="1594.0" y="64.0" fill="#2563EB" font-size="15" font-weight="780" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">DECODING MENTAL MODEL</text>
