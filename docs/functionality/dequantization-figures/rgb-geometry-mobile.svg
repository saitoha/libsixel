<svg xmlns="http://www.w3.org/2000/svg" width="380" height="1590" viewBox="0 0 380 1590" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Four-point RGB geometry</title>
<desc id="desc">A and B and their midpoint M are fixed. Three different palettes place the nearest other color P off the A-B line. The squared midpoint distances determine the pair weight. The dashed circle has radius M-A. This is an exact constant-blue slice, not a projection with distorted distances.</desc>
<rect x="0" y="0" width="380" height="1590" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="35" font-size="18" fill="#183247" font-weight="700" text-anchor="start">The nearest color need not lie on A–B</text>
<text x="20" y="64" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">RGB slice: blue = 128 in every point</text>
<rect x="20" y="90" width="340" height="450" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="36" y="120" font-size="19" fill="#183247" font-weight="700" text-anchor="start">1  P = (144, 144, 128)</text>
<path d="M 52 155 V 405 H 335" fill="none" stroke="#c8d0d7"/>
<text x="59" y="160" font-size="13" fill="#4c6070" font-weight="400" text-anchor="start">Green ↑</text>
<text x="264" y="425" font-size="13" fill="#4c6070" font-weight="400" text-anchor="start">Red →</text>
<circle cx="163.60000000000002" cy="317.8" r="70.4" fill="none" stroke="#91a8b7" stroke-dasharray="3 4"/>
<path d="M 93.2 317.8 L 181.20000000000002 300.2 L 234.0 317.8 Z" fill="#e5f3fa" fill-opacity="0.55" stroke="#91a8b7"/>
<path d="M 163.60000000000002 317.8 L 181.20000000000002 300.2" stroke="#17618c" stroke-width="3"/>
<path d="M 93.2 317.8 L 163.60000000000002 317.8" stroke="#855012" stroke-width="3"/>
<path d="M 62.8 212.6 l 8 8 m -8 0 l 8 -8" stroke="#607586" stroke-width="2"/>
<path d="M 266.3 218.1 l 8 8 m -8 0 l 8 -8" stroke="#607586" stroke-width="2"/>
<rect x="87.2" y="311.8" width="12" height="12" rx="0" fill="rgb(64,128,128)" stroke="#183247" stroke-width="1"/>
<text x="93.2" y="343.8" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">A</text>
<rect x="228.0" y="311.8" width="12" height="12" rx="0" fill="rgb(192,128,128)" stroke="#183247" stroke-width="1"/>
<text x="234.0" y="343.8" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">B</text>
<rect x="175.20000000000002" y="294.2" width="12" height="12" rx="0" fill="rgb(144,144,128)" stroke="#183247" stroke-width="1"/>
<text x="193.20000000000002" y="288.2" font-size="17" fill="#183247" font-weight="700" text-anchor="start">P</text>
<circle cx="163.60000000000002" cy="317.8" r="5" fill="white" stroke="#855012" stroke-width="2"/>
<text x="163.60000000000002" y="343.8" font-size="17" fill="#855012" font-weight="700" text-anchor="middle">M</text>
<text x="36" y="450" font-size="18" fill="#17618c" font-weight="700" text-anchor="start">q/d = 512/4096 = 0.125</text>
<text x="36" y="481" font-size="16" fill="#183247" font-weight="400" text-anchor="start">Neighbor weight: upstream 0</text>
<text x="36" y="509" font-size="16" fill="#183247" font-weight="400" text-anchor="start">libsixel 0 at -S 100</text>
<rect x="20" y="555" width="340" height="450" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="36" y="585" font-size="19" fill="#183247" font-weight="700" text-anchor="start">2  P = (152, 176, 128)</text>
<path d="M 52 620 V 870 H 335" fill="none" stroke="#c8d0d7"/>
<text x="59" y="625" font-size="13" fill="#4c6070" font-weight="400" text-anchor="start">Green ↑</text>
<text x="264" y="890" font-size="13" fill="#4c6070" font-weight="400" text-anchor="start">Red →</text>
<circle cx="163.60000000000002" cy="782.8" r="70.4" fill="none" stroke="#91a8b7" stroke-dasharray="3 4"/>
<path d="M 93.2 782.8 L 190.0 730.0 L 234.0 782.8 Z" fill="#e5f3fa" fill-opacity="0.55" stroke="#91a8b7"/>
<path d="M 163.60000000000002 782.8 L 190.0 730.0" stroke="#17618c" stroke-width="3"/>
<path d="M 93.2 782.8 L 163.60000000000002 782.8" stroke="#855012" stroke-width="3"/>
<path d="M 62.8 677.6 l 8 8 m -8 0 l 8 -8" stroke="#607586" stroke-width="2"/>
<path d="M 266.3 683.1 l 8 8 m -8 0 l 8 -8" stroke="#607586" stroke-width="2"/>
<rect x="87.2" y="776.8" width="12" height="12" rx="0" fill="rgb(64,128,128)" stroke="#183247" stroke-width="1"/>
<text x="93.2" y="808.8" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">A</text>
<rect x="228.0" y="776.8" width="12" height="12" rx="0" fill="rgb(192,128,128)" stroke="#183247" stroke-width="1"/>
<text x="234.0" y="808.8" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">B</text>
<rect x="184.0" y="724.0" width="12" height="12" rx="0" fill="rgb(152,176,128)" stroke="#183247" stroke-width="1"/>
<text x="202.0" y="718.0" font-size="17" fill="#183247" font-weight="700" text-anchor="start">P</text>
<circle cx="163.60000000000002" cy="782.8" r="5" fill="white" stroke="#855012" stroke-width="2"/>
<text x="163.60000000000002" y="808.8" font-size="17" fill="#855012" font-weight="700" text-anchor="middle">M</text>
<text x="36" y="915" font-size="18" fill="#17618c" font-weight="700" text-anchor="start">q/d = 2880/4096 = 0.703125</text>
<text x="36" y="946" font-size="16" fill="#183247" font-weight="400" text-anchor="start">Neighbor weight: upstream 1</text>
<text x="36" y="974" font-size="16" fill="#183247" font-weight="400" text-anchor="start">libsixel 5 at -S 100</text>
<rect x="20" y="1020" width="340" height="450" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="36" y="1050" font-size="19" fill="#183247" font-weight="700" text-anchor="start">3  P = (160, 192, 128)</text>
<path d="M 52 1085 V 1335 H 335" fill="none" stroke="#c8d0d7"/>
<text x="59" y="1090" font-size="13" fill="#4c6070" font-weight="400" text-anchor="start">Green ↑</text>
<text x="264" y="1355" font-size="13" fill="#4c6070" font-weight="400" text-anchor="start">Red →</text>
<circle cx="163.60000000000002" cy="1247.8" r="70.4" fill="none" stroke="#91a8b7" stroke-dasharray="3 4"/>
<path d="M 93.2 1247.8 L 198.8 1177.4 L 234.0 1247.8 Z" fill="#e5f3fa" fill-opacity="0.55" stroke="#91a8b7"/>
<path d="M 163.60000000000002 1247.8 L 198.8 1177.4" stroke="#17618c" stroke-width="3"/>
<path d="M 93.2 1247.8 L 163.60000000000002 1247.8" stroke="#855012" stroke-width="3"/>
<path d="M 62.8 1142.6 l 8 8 m -8 0 l 8 -8" stroke="#607586" stroke-width="2"/>
<path d="M 266.3 1148.1 l 8 8 m -8 0 l 8 -8" stroke="#607586" stroke-width="2"/>
<rect x="87.2" y="1241.8" width="12" height="12" rx="0" fill="rgb(64,128,128)" stroke="#183247" stroke-width="1"/>
<text x="93.2" y="1273.8" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">A</text>
<rect x="228.0" y="1241.8" width="12" height="12" rx="0" fill="rgb(192,128,128)" stroke="#183247" stroke-width="1"/>
<text x="234.0" y="1273.8" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">B</text>
<rect x="192.8" y="1171.4" width="12" height="12" rx="0" fill="rgb(160,192,128)" stroke="#183247" stroke-width="1"/>
<text x="210.8" y="1165.4" font-size="17" fill="#183247" font-weight="700" text-anchor="start">P</text>
<circle cx="163.60000000000002" cy="1247.8" r="5" fill="white" stroke="#855012" stroke-width="2"/>
<text x="163.60000000000002" y="1273.8" font-size="17" fill="#855012" font-weight="700" text-anchor="middle">M</text>
<text x="36" y="1380" font-size="18" fill="#17618c" font-weight="700" text-anchor="start">q/d = 5120/4096 = 1.25</text>
<text x="36" y="1411" font-size="16" fill="#183247" font-weight="400" text-anchor="start">Neighbor weight: upstream 6</text>
<text x="36" y="1439" font-size="16" fill="#183247" font-weight="400" text-anchor="start">libsixel 8 at -S 100</text>
<text x="20" y="1499" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">A=(64,128,128); B=(192,128,128).</text><text x="20" y="1521" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">M=(128,128,128); d=|M−A|²; q=|M−P|².</text><text x="20" y="1543" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">Dashed circle: |M−A|. Crosses: other colors.</text><text x="20" y="1565" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">P is the closest other palette entry to M.</text>
</svg>
