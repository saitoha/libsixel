<svg xmlns="http://www.w3.org/2000/svg" width="380" height="850" viewBox="0 0 380 850" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Look all around</title>
<desc id="desc">Look all around. Consider all eight neighbors. Use the image palette to decide how much each color contributes. Optional edge protection (-e) can keep strong edges sharper. The grid marks the center and eligible neighbor positions. This is a schematic, not a measured image comparison.</desc>
<rect x="0" y="0" width="380" height="850" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="24" y="37" font-size="26" fill="#183247" font-weight="700" text-anchor="start">Look all around</text>
<text x="24" y="65" font-size="16" fill="#17618c" font-weight="400" text-anchor="start">k_undither = lso_undither:Vfs</text>
<text x="24" y="101" font-size="18" fill="#183247" font-weight="700" text-anchor="start">1  Which pixels are considered?</text>
<rect x="74" y="115" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="110" y="150" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="154" y="115" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="190" y="150" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="234" y="115" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="270" y="150" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="74" y="185" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="110" y="220" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="154" y="185" width="72" height="62" rx="7" fill="#fff0d6" stroke="#855012" stroke-width="3"/><text x="190" y="220" font-size="13" fill="#855012" font-weight="700" text-anchor="middle">CENTER</text><rect x="234" y="185" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="270" y="220" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="74" y="255" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="110" y="290" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="154" y="255" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="190" y="290" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="234" y="255" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="270" y="290" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text>
<text x="24" y="353" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">CENTER = the pixel being updated</text><text x="24" y="376" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Labels show the role of each square.</text>
<text x="24" y="440" font-size="18" fill="#183247" font-weight="700" text-anchor="start">2  How is the center updated?</text>
<text x="24" y="478" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Consider all eight neighbors.</text><text x="24" y="504" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Use the image palette to decide</text><text x="24" y="530" font-size="17" fill="#183247" font-weight="400" text-anchor="start">how much each color contributes.</text>
<rect x="24" y="552" width="332" height="104" rx="10" fill="#f3f7fa" stroke="none" stroke-width="1"/><text x="39" y="577" font-size="15" fill="#183247" font-weight="400" text-anchor="start">Palette = colors stored in the image</text><rect x="39" y="589" width="40" height="24" rx="4" fill="#24577a" stroke="none" stroke-width="1"/><rect x="87" y="589" width="40" height="24" rx="4" fill="#69a6c3" stroke="none" stroke-width="1"/><rect x="135" y="589" width="40" height="24" rx="4" fill="#d3e7e9" stroke="none" stroke-width="1"/><rect x="183" y="589" width="40" height="24" rx="4" fill="#bd6a34" stroke="none" stroke-width="1"/><rect x="231" y="589" width="40" height="24" rx="4" fill="#e6bd7f" stroke="none" stroke-width="1"/><text x="39" y="638" font-size="15" fill="#183247" font-weight="400" text-anchor="start">The palette affects mixing weights.</text>
<text x="24" y="687" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">Optional edge protection (-e)</text><text x="24" y="712" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">can keep strong edges sharper.</text>
<text x="24" y="803" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">Concept diagram • not a measured before/after image.</text><text x="24" y="824" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">Only the center is updated here; repeat across the image.</text>
</svg>
