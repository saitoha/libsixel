<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Look all around</title>
<desc id="desc">Look all around. Consider all eight neighbors. Use the image palette to decide how much each color contributes. Optional edge protection (-e) can keep strong edges sharper. The grid marks the center and eligible neighbor positions. This is a schematic, not a measured image comparison.</desc>
<rect x="0" y="0" width="960" height="510" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="24" y="37" font-size="26" fill="#183247" font-weight="700" text-anchor="start">Look all around</text>
<text x="24" y="65" font-size="16" fill="#17618c" font-weight="400" text-anchor="start">k_undither = lso_undither:Vfs</text>
<text x="42" y="112" font-size="18" fill="#183247" font-weight="700" text-anchor="start">1  Which pixels are considered?</text>
<rect x="66" y="139" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="102" y="174" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="146" y="139" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="182" y="174" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="226" y="139" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="262" y="174" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="66" y="209" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="102" y="244" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="146" y="209" width="72" height="62" rx="7" fill="#fff0d6" stroke="#855012" stroke-width="3"/><text x="182" y="244" font-size="13" fill="#855012" font-weight="700" text-anchor="middle">CENTER</text><rect x="226" y="209" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="262" y="244" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="66" y="279" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="102" y="314" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="146" y="279" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="182" y="314" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text><rect x="226" y="279" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="262" y="314" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">USE</text>
<text x="42" y="377" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">CENTER = the pixel being updated</text><text x="42" y="400" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Labels show the role of each square.</text>
<text x="460" y="112" font-size="18" fill="#183247" font-weight="700" text-anchor="start">2  How is the center updated?</text>
<text x="460" y="150" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Consider all eight neighbors.</text><text x="460" y="176" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Use the image palette to decide</text><text x="460" y="202" font-size="17" fill="#183247" font-weight="400" text-anchor="start">how much each color contributes.</text>
<rect x="460" y="224" width="458" height="104" rx="10" fill="#f3f7fa" stroke="none" stroke-width="1"/><text x="475" y="249" font-size="15" fill="#183247" font-weight="400" text-anchor="start">Palette = colors stored in the image</text><rect x="475" y="261" width="40" height="24" rx="4" fill="#24577a" stroke="none" stroke-width="1"/><rect x="523" y="261" width="40" height="24" rx="4" fill="#69a6c3" stroke="none" stroke-width="1"/><rect x="571" y="261" width="40" height="24" rx="4" fill="#d3e7e9" stroke="none" stroke-width="1"/><rect x="619" y="261" width="40" height="24" rx="4" fill="#bd6a34" stroke="none" stroke-width="1"/><rect x="667" y="261" width="40" height="24" rx="4" fill="#e6bd7f" stroke="none" stroke-width="1"/><text x="475" y="310" font-size="15" fill="#183247" font-weight="400" text-anchor="start">The palette affects mixing weights.</text>
<text x="460" y="359" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">Optional edge protection (-e)</text><text x="460" y="384" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">can keep strong edges sharper.</text>
<text x="24" y="463" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Concept diagram • not a measured before/after image.</text><text x="24" y="484" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Only the center is updated here; repeat across the image.</text>
</svg>
