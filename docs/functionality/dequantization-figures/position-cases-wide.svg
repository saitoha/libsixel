<svg xmlns="http://www.w3.org/2000/svg" width="980" height="990" viewBox="0 0 980 990" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Position cases for the nearest palette color</title>
<desc id="desc">Concentric boundaries around M classify the possible nearest other palette color P. The radius is the square root of the listed squared-distance ratio. A and B stay fixed. Upstream has four weight regions; libsixel has eight. Exact boundary points belong to the outer region.</desc>
<rect x="0" y="0" width="980" height="990" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="34" font-size="28" fill="#183247" font-weight="700" text-anchor="start">Where can the nearest color P lie?</text>
<text x="20" y="62" font-size="18" fill="#4c6070" font-weight="400" text-anchor="start">Position → distance ratio → neighbor weight</text>
<rect x="20" y="85" width="465" height="825" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="36" y="117" font-size="22" fill="#183247" font-weight="700" text-anchor="start">Upstream</text>
<circle cx="252.5" cy="310" r="162.81277591147446" fill="#d4e4ef" stroke="#96aabb" stroke-width="1"/>
<circle cx="252.5" cy="310" r="132.93607486307096" fill="#f0f6fa" stroke="#96aabb" stroke-width="1"/>
<circle cx="252.5" cy="310" r="94.0" fill="#dfeaf4" stroke="#96aabb" stroke-width="1"/>
<circle cx="252.5" cy="310" r="76.75067860720625" fill="#f5f8fc" stroke="#96aabb" stroke-width="1"/>
<circle cx="252.5" cy="310" r="94" fill="none" stroke="#855012" stroke-width="2"/>
<path d="M 158.5 310 H 346.5" stroke="#855012" stroke-width="2"/>
<rect x="154.5" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="158.5" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">A</text>
<rect x="248.5" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="252.5" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">M</text>
<rect x="342.5" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="346.5" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">B</text>
<circle cx="279.45809250849913" cy="271.4998539184174" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="279.45809250849913" y="275.4998539184174" font-size="12" fill="white" font-weight="700" text-anchor="middle">1</text>
<circle cx="187.29382182549995" cy="255.28551994329698" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="187.29382182549995" y="259.285519943297" font-size="12" fill="white" font-weight="700" text-anchor="middle">2</text>
<circle cx="205.49542494004638" cy="410.80163651168164" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="205.49542494004638" y="414.80163651168164" font-size="12" fill="white" font-weight="700" text-anchor="middle">3</text>
<circle cx="374.24815186700783" cy="395.2489737003795" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="374.24815186700783" y="399.2489737003795" font-size="12" fill="white" font-weight="700" text-anchor="middle">4</text>
<text x="36" y="506" font-size="18" fill="#17618c" font-weight="700" text-anchor="start">r = |M−P|² / |M−A|²</text>
<text x="36" y="535" font-size="16" fill="#183247" font-weight="700" text-anchor="start">Case / position of P</text>
<text x="469" y="535" font-size="16" fill="#183247" font-weight="700" text-anchor="end">Weight</text>
<text x="36" y="566" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#1</text>
<text x="85" y="566" font-size="16" fill="#183247" font-weight="400" text-anchor="start">0 ≤ r &lt; 2/3</text>
<text x="461" y="566" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">0</text>
<text x="36" y="596" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#2</text>
<text x="85" y="596" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2/3 ≤ r &lt; 1</text>
<text x="461" y="596" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">1</text>
<text x="36" y="626" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#3</text>
<text x="85" y="626" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1 ≤ r &lt; 2</text>
<text x="461" y="626" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">6</text>
<text x="36" y="656" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#4</text>
<text x="85" y="656" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2 ≤ r</text>
<text x="461" y="656" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">8</text>
<text x="36" y="858" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Farther P gives larger weights here.</text><text x="36" y="880" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">The gradient gate is a separate step.</text>
<rect x="505" y="85" width="465" height="825" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="521" y="117" font-size="22" fill="#183247" font-weight="700" text-anchor="start">libsixel (-S 100)</text>
<circle cx="737.5" cy="310" r="162.81277591147446" fill="#f0f3f6" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="132.93607486307096" fill="#e2ebf3" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="94.0" fill="#cbddeb" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="81.40638795573723" fill="#eaf0f8" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="76.75067860720625" fill="#d4e4ef" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="72.81208690869944" fill="#f0f6fa" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="66.46803743153548" fill="#dfeaf4" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="54.27092530382482" fill="#f5f8fc" stroke="#96aabb" stroke-width="1"/>
<circle cx="737.5" cy="310" r="94" fill="none" stroke="#855012" stroke-width="2"/>
<path d="M 643.5 310 H 831.5" stroke="#855012" stroke-width="2"/>
