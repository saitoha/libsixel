<text x="643.5" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">A</text>
<rect x="733.5" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="737.5" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">M</text>
<rect x="827.5" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="831.5" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">B</text>
<circle cx="763.2429602027428" cy="284.2570397972572" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="763.2429602027428" y="288.2570397972572" font-size="12" fill="white" font-weight="700" text-anchor="middle">1</text>
<circle cx="726.921533165222" cy="250.00653336049416" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="726.921533165222" y="254.00653336049416" font-size="12" fill="white" font-weight="700" text-anchor="middle">2</text>
<circle cx="677.1274068802738" cy="275.1438671106504" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="677.1274068802738" y="279.1438671106504" font-size="12" fill="white" font-weight="700" text-anchor="middle">3</text>
<circle cx="669.8802065549966" cy="341.5316275262643" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="669.8802065549966" y="345.5316275262643" font-size="12" fill="white" font-weight="700" text-anchor="middle">4</text>
<circle cx="717.144906380558" cy="385.9662435805783" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="717.144906380558" y="389.9662435805783" font-size="12" fill="white" font-weight="700" text-anchor="middle">5</text>
<circle cx="787.2082664731845" cy="380.9907616822843" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="787.2082664731845" y="384.9907616822843" font-size="12" fill="white" font-weight="700" text-anchor="middle">6</text>
<circle cx="833.8213372000203" cy="254.3888500388636" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="833.8213372000203" y="258.3888500388636" font-size="12" fill="white" font-weight="700" text-anchor="middle">7</text>
<circle cx="615.7518481329921" cy="224.75102629962055" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="615.7518481329921" y="228.75102629962055" font-size="12" fill="white" font-weight="700" text-anchor="middle">8</text>
<text x="521" y="506" font-size="18" fill="#17618c" font-weight="700" text-anchor="start">r = |M−P|² / |M−A|²</text>
<text x="521" y="535" font-size="16" fill="#183247" font-weight="700" text-anchor="start">Case / position of P</text>
<text x="954" y="535" font-size="16" fill="#183247" font-weight="700" text-anchor="end">Weight</text>
<text x="521" y="566" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#1</text>
<text x="570" y="566" font-size="16" fill="#183247" font-weight="400" text-anchor="start">0 ≤ r &lt; 1/3</text>
<text x="946" y="566" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">0</text>
<text x="521" y="596" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#2</text>
<text x="570" y="596" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1/3 ≤ r &lt; 1/2</text>
<text x="946" y="596" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">2</text>
<text x="521" y="626" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#3</text>
<text x="570" y="626" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1/2 ≤ r &lt; 3/5</text>
<text x="946" y="626" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">4</text>
<text x="521" y="656" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#4</text>
<text x="570" y="656" font-size="16" fill="#183247" font-weight="400" text-anchor="start">3/5 ≤ r &lt; 2/3</text>
<text x="946" y="656" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">7</text>
<text x="521" y="686" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#5</text>
<text x="570" y="686" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2/3 ≤ r &lt; 3/4</text>
<text x="946" y="686" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">5</text>
<text x="521" y="716" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#6</text>
<text x="570" y="716" font-size="16" fill="#183247" font-weight="400" text-anchor="start">3/4 ≤ r &lt; 1</text>
<text x="946" y="716" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">7</text>
<text x="521" y="746" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#7</text>
<text x="570" y="746" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1 ≤ r &lt; 2</text>
<text x="946" y="746" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">8</text>
<text x="521" y="776" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#8</text>
<text x="570" y="776" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2 ≤ r</text>
<text x="946" y="776" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">5</text>
<text x="521" y="858" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Weights rise and fall across rings.</text><text x="521" y="880" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Distance is not a linear blur control.</text>
<text x="20" y="956" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Numbered P positions are separate cases, not one palette.</text><text x="20" y="976" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Gold circle: r=1. Circles are slices of RGB spheres.</text>
</svg>
