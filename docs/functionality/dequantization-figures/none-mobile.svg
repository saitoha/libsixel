<svg xmlns="http://www.w3.org/2000/svg" width="380" height="850" viewBox="0 0 380 850" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Keep each pixel</title>
<desc id="desc">Keep each pixel. Read the center pixel. Keep its decoded color. No neighboring colors are mixed. Useful when every pixel matters: pixel art, text, or inspection. The grid marks the center and eligible neighbor positions. This is a schematic, not a measured image comparison.</desc>
<rect x="0" y="0" width="380" height="850" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="24" y="37" font-size="26" fill="#183247" font-weight="700" text-anchor="start">Keep each pixel</text>
<text x="24" y="65" font-size="16" fill="#17618c" font-weight="400" text-anchor="start">none</text>
<text x="24" y="101" font-size="18" fill="#183247" font-weight="700" text-anchor="start">1  Which pixels are considered?</text>
<rect x="74" y="115" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="110" y="150" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text><rect x="154" y="115" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="190" y="150" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text><rect x="234" y="115" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="270" y="150" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text><rect x="74" y="185" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="110" y="220" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text><rect x="154" y="185" width="72" height="62" rx="7" fill="#fff0d6" stroke="#855012" stroke-width="3"/><text x="190" y="220" font-size="13" fill="#855012" font-weight="700" text-anchor="middle">CENTER</text><rect x="234" y="185" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="270" y="220" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text><rect x="74" y="255" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="110" y="290" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text><rect x="154" y="255" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="190" y="290" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text><rect x="234" y="255" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="270" y="290" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">SKIP</text>
<text x="24" y="353" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">CENTER = the pixel being updated</text><text x="24" y="376" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Labels show the role of each square.</text>
<text x="24" y="440" font-size="18" fill="#183247" font-weight="700" text-anchor="start">2  How is the center updated?</text>
<text x="24" y="478" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Read the center pixel.</text><text x="24" y="504" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Keep its decoded color.</text><text x="24" y="530" font-size="17" fill="#183247" font-weight="400" text-anchor="start">No neighboring colors are mixed.</text>
<rect x="24" y="552" width="332" height="104" rx="10" fill="#f3f7fa" stroke="none" stroke-width="1"/><rect x="42" y="568" width="64" height="35" rx="5" fill="#bd6a34" stroke="none" stroke-width="1"/><text x="74" y="628" font-size="16" fill="#183247" font-weight="400" text-anchor="middle">Input</text><rect x="268" y="568" width="64" height="35" rx="5" fill="#bd6a34" stroke="none" stroke-width="1"/><text x="300" y="628" font-size="16" fill="#183247" font-weight="400" text-anchor="middle">Output</text><text x="190.0" y="593" font-size="25" fill="#183247" font-weight="400" text-anchor="middle">=</text>
<text x="24" y="687" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">Useful when every pixel matters:</text><text x="24" y="712" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">pixel art, text, or inspection.</text>
<text x="24" y="803" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">Concept diagram • not a measured before/after image.</text><text x="24" y="824" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">Only the center is updated here; repeat across the image.</text>
</svg>
