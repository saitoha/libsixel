<svg xmlns="http://www.w3.org/2000/svg" width="380" height="1850" viewBox="0 0 380 1850" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Position cases for the nearest palette color</title>
<desc id="desc">Concentric boundaries around M classify the possible nearest other palette color P. The radius is the square root of the listed squared-distance ratio. A and B stay fixed. Upstream has four weight regions; libsixel has eight. Exact boundary points belong to the outer region.</desc>
<rect x="0" y="0" width="380" height="1850" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="34" font-size="19" fill="#183247" font-weight="700" text-anchor="start">Where can the nearest color P lie?</text>
<text x="20" y="62" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Position → distance ratio → neighbor weight</text>
<rect x="20" y="85" width="340" height="825" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="36" y="117" font-size="22" fill="#183247" font-weight="700" text-anchor="start">Upstream</text>
<circle cx="190.0" cy="310" r="162.81277591147446" fill="#d4e4ef" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="310" r="132.93607486307096" fill="#f0f6fa" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="310" r="94.0" fill="#dfeaf4" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="310" r="76.75067860720625" fill="#f5f8fc" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="310" r="94" fill="none" stroke="#855012" stroke-width="2"/>
<path d="M 96.0 310 H 284.0" stroke="#855012" stroke-width="2"/>
<rect x="92.0" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="96.0" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">A</text>
<rect x="186.0" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="190.0" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">M</text>
<rect x="280.0" y="306" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="284.0" y="332" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">B</text>
<circle cx="216.95809250849916" cy="271.4998539184174" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="216.95809250849916" y="275.4998539184174" font-size="12" fill="white" font-weight="700" text-anchor="middle">1</text>
<circle cx="124.79382182549995" cy="255.28551994329698" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="124.79382182549995" y="259.285519943297" font-size="12" fill="white" font-weight="700" text-anchor="middle">2</text>
<circle cx="142.99542494004638" cy="410.80163651168164" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="142.99542494004638" y="414.80163651168164" font-size="12" fill="white" font-weight="700" text-anchor="middle">3</text>
<circle cx="311.74815186700783" cy="395.2489737003795" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="311.74815186700783" y="399.2489737003795" font-size="12" fill="white" font-weight="700" text-anchor="middle">4</text>
<text x="36" y="506" font-size="18" fill="#17618c" font-weight="700" text-anchor="start">r = |M−P|² / |M−A|²</text>
<text x="36" y="535" font-size="16" fill="#183247" font-weight="700" text-anchor="start">Case / position of P</text>
<text x="344" y="535" font-size="16" fill="#183247" font-weight="700" text-anchor="end">Weight</text>
<text x="36" y="566" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#1</text>
<text x="85" y="566" font-size="16" fill="#183247" font-weight="400" text-anchor="start">0 ≤ r &lt; 2/3</text>
<text x="336" y="566" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">0</text>
<text x="36" y="596" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#2</text>
<text x="85" y="596" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2/3 ≤ r &lt; 1</text>
<text x="336" y="596" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">1</text>
<text x="36" y="626" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#3</text>
<text x="85" y="626" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1 ≤ r &lt; 2</text>
<text x="336" y="626" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">6</text>
<text x="36" y="656" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#4</text>
<text x="85" y="656" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2 ≤ r</text>
<text x="336" y="656" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">8</text>
<text x="36" y="858" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Farther P gives larger weights here.</text><text x="36" y="880" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">The gradient gate is a separate step.</text>
<rect x="20" y="930" width="340" height="825" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="36" y="962" font-size="22" fill="#183247" font-weight="700" text-anchor="start">libsixel (-S 100)</text>
<circle cx="190.0" cy="1155" r="162.81277591147446" fill="#f0f3f6" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="132.93607486307096" fill="#e2ebf3" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="94.0" fill="#cbddeb" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="81.40638795573723" fill="#eaf0f8" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="76.75067860720625" fill="#d4e4ef" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="72.81208690869944" fill="#f0f6fa" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="66.46803743153548" fill="#dfeaf4" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="54.27092530382482" fill="#f5f8fc" stroke="#96aabb" stroke-width="1"/>
<circle cx="190.0" cy="1155" r="94" fill="none" stroke="#855012" stroke-width="2"/>
<path d="M 96.0 1155 H 284.0" stroke="#855012" stroke-width="2"/>
<rect x="92.0" y="1151" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="96.0" y="1177" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">A</text>
<rect x="186.0" y="1151" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="190.0" y="1177" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">M</text>
<rect x="280.0" y="1151" width="8" height="8" rx="0" fill="white" stroke="#855012" stroke-width="2"/>
<text x="284.0" y="1177" font-size="16" fill="#855012" font-weight="700" text-anchor="middle">B</text>
<circle cx="215.7429602027428" cy="1129.2570397972572" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="215.7429602027428" y="1133.2570397972572" font-size="12" fill="white" font-weight="700" text-anchor="middle">1</text>
<circle cx="179.42153316522192" cy="1095.0065333604941" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="179.42153316522192" y="1099.0065333604941" font-size="12" fill="white" font-weight="700" text-anchor="middle">2</text>
<circle cx="129.6274068802739" cy="1120.1438671106505" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="129.6274068802739" y="1124.1438671106505" font-size="12" fill="white" font-weight="700" text-anchor="middle">3</text>
<circle cx="122.38020655499653" cy="1186.5316275262642" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="122.38020655499653" y="1190.5316275262642" font-size="12" fill="white" font-weight="700" text-anchor="middle">4</text>
<circle cx="169.6449063805581" cy="1230.9662435805783" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="169.6449063805581" y="1234.9662435805783" font-size="12" fill="white" font-weight="700" text-anchor="middle">5</text>
<circle cx="239.7082664731845" cy="1225.9907616822843" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="239.7082664731845" y="1229.9907616822843" font-size="12" fill="white" font-weight="700" text-anchor="middle">6</text>
<circle cx="286.32133720002025" cy="1099.3888500388637" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="286.32133720002025" y="1103.3888500388637" font-size="12" fill="white" font-weight="700" text-anchor="middle">7</text>
<circle cx="68.25184813299211" cy="1069.7510262996207" r="9" fill="#17618c" stroke="white" stroke-width="1"/>
<text x="68.25184813299211" y="1073.7510262996207" font-size="12" fill="white" font-weight="700" text-anchor="middle">8</text>
<text x="36" y="1351" font-size="18" fill="#17618c" font-weight="700" text-anchor="start">r = |M−P|² / |M−A|²</text>
<text x="36" y="1380" font-size="16" fill="#183247" font-weight="700" text-anchor="start">Case / position of P</text>
<text x="344" y="1380" font-size="16" fill="#183247" font-weight="700" text-anchor="end">Weight</text>
<text x="36" y="1411" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#1</text>
<text x="85" y="1411" font-size="16" fill="#183247" font-weight="400" text-anchor="start">0 ≤ r &lt; 1/3</text>
<text x="336" y="1411" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">0</text>
<text x="36" y="1441" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#2</text>
<text x="85" y="1441" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1/3 ≤ r &lt; 1/2</text>
<text x="336" y="1441" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">2</text>
<text x="36" y="1471" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#3</text>
<text x="85" y="1471" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1/2 ≤ r &lt; 3/5</text>
<text x="336" y="1471" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">4</text>
<text x="36" y="1501" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#4</text>
<text x="85" y="1501" font-size="16" fill="#183247" font-weight="400" text-anchor="start">3/5 ≤ r &lt; 2/3</text>
<text x="336" y="1501" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">7</text>
<text x="36" y="1531" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#5</text>
<text x="85" y="1531" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2/3 ≤ r &lt; 3/4</text>
<text x="336" y="1531" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">5</text>
<text x="36" y="1561" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#6</text>
<text x="85" y="1561" font-size="16" fill="#183247" font-weight="400" text-anchor="start">3/4 ≤ r &lt; 1</text>
<text x="336" y="1561" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">7</text>
<text x="36" y="1591" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#7</text>
<text x="85" y="1591" font-size="16" fill="#183247" font-weight="400" text-anchor="start">1 ≤ r &lt; 2</text>
<text x="336" y="1591" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">8</text>
<text x="36" y="1621" font-size="16" fill="#183247" font-weight="400" text-anchor="start">#8</text>
<text x="85" y="1621" font-size="16" fill="#183247" font-weight="400" text-anchor="start">2 ≤ r</text>
<text x="336" y="1621" font-size="18" fill="#17618c" font-weight="700" text-anchor="end">5</text>
<text x="36" y="1703" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Weights rise and fall across rings.</text><text x="36" y="1725" font-size="14" fill="#4c6070" font-weight="400" text-anchor="start">Distance is not a linear blur control.</text>
<text x="20" y="1784" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">Numbered P positions are separate cases;</text><text x="20" y="1804" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">they are not entries in one shared palette.</text><text x="20" y="1824" font-size="12" fill="#4c6070" font-weight="400" text-anchor="start">Gold circle: r=1. RGB boundaries are spheres.</text>
</svg>
