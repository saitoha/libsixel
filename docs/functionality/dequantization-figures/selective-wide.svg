<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Mix only nearby colors</title>
<desc id="desc">Mix only nearby colors. Compare each neighbor to center. Mix colors within the threshold. Leave distant colors out. Higher threshold: more colors mix. The neighborhood stays 3 x 3. The grid marks the center and eligible neighbor positions. This is a schematic, not a measured image comparison.</desc>
<rect x="0" y="0" width="960" height="510" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="24" y="37" font-size="26" fill="#183247" font-weight="700" text-anchor="start">Mix only nearby colors</text>
<text x="24" y="65" font-size="16" fill="#17618c" font-weight="400" text-anchor="start">selective_blur</text>
<text x="42" y="112" font-size="18" fill="#183247" font-weight="700" text-anchor="start">1  Which pixels are considered?</text>
<rect x="66" y="139" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="102" y="174" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">NEAR</text><rect x="146" y="139" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="182" y="174" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">NEAR</text><rect x="226" y="139" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="262" y="174" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">FAR</text><rect x="66" y="209" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="102" y="244" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">NEAR</text><rect x="146" y="209" width="72" height="62" rx="7" fill="#fff0d6" stroke="#855012" stroke-width="3"/><text x="182" y="244" font-size="13" fill="#855012" font-weight="700" text-anchor="middle">CENTER</text><rect x="226" y="209" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="262" y="244" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">FAR</text><rect x="66" y="279" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="102" y="314" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">NEAR</text><rect x="146" y="279" width="72" height="62" rx="7" fill="#e5f3fa" stroke="#17618c" stroke-width="1"/><text x="182" y="314" font-size="13" fill="#17618c" font-weight="700" text-anchor="middle">NEAR</text><rect x="226" y="279" width="72" height="62" rx="7" fill="#f1f3f5" stroke="#c8d0d7" stroke-width="1"/><text x="262" y="314" font-size="13" fill="#4c6070" font-weight="700" text-anchor="middle">FAR</text>
<text x="42" y="377" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">CENTER = the pixel being updated</text><text x="42" y="400" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Labels show the role of each square.</text>
<text x="42" y="424" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">NEAR / FAR is one possible pattern.</text>
<text x="460" y="112" font-size="18" fill="#183247" font-weight="700" text-anchor="start">2  How is the center updated?</text>
<text x="460" y="150" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Compare each neighbor to center.</text><text x="460" y="176" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Mix colors within the threshold.</text><text x="460" y="202" font-size="17" fill="#183247" font-weight="400" text-anchor="start">Leave distant colors out.</text>
<rect x="460" y="224" width="458" height="104" rx="10" fill="#f3f7fa" stroke="none" stroke-width="1"/><text x="475" y="248" font-size="15" fill="#183247" font-weight="400" text-anchor="start">Example: threshold 24, red channel</text><text x="475" y="276" font-size="21" fill="#17618c" font-weight="700" text-anchor="start">100 + nearby 112  →  104</text><text x="475" y="305" font-size="14" fill="#183247" font-weight="400" text-anchor="start">Center weight 4; neighbor weight 2.</text>
<text x="460" y="359" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">Higher threshold: more colors mix.</text><text x="460" y="384" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">The neighborhood stays 3 x 3.</text>
<text x="24" y="463" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Concept diagram • not a measured before/after image.</text><text x="24" y="484" font-size="15" fill="#4c6070" font-weight="400" text-anchor="start">Only the center is updated here; repeat across the image.</text>
</svg>
