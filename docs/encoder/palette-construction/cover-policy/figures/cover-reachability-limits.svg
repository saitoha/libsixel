<text x="486.0" y="775.0" fill="#172033" font-size="20" font-weight="700" font-family="system-ui, sans-serif" text-anchor="start">Error diffusion is spatial transport.</text>
<text x="486.0" y="815.0" fill="#172033" font-size="18" font-weight="500" font-family="system-ui, sans-serif" text-anchor="start">A finite patch may export its residual to neighbors</text>
<text x="486.0" y="846.0" fill="#172033" font-size="18" font-weight="500" font-family="system-ui, sans-serif" text-anchor="start">or the image boundary before its own average converges.</text>
<text x="486.0" y="893.0" fill="#172033" font-size="18" font-weight="500" font-family="system-ui, sans-serif" text-anchor="start">Cover repair improves the available palette geometry;</text>
<text x="486.0" y="924.0" fill="#BE185D" font-size="18" font-weight="700" font-family="system-ui, sans-serif" text-anchor="start">it cannot promise every lookup/dither trajectory.</text>
<text x="60.0" y="990.0" fill="#556176" font-size="16" font-weight="400" font-family="system-ui, sans-serif" text-anchor="start">Schematic execution model • actual trajectories depend on lookup policy, diffusion policy, scan order, and region extent</text>
</svg>
