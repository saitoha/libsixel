<text x="714.0" y="239" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<rect x="746.0" y="205" width="56" height="56" rx="3" fill="rgb(160,160,160)" stroke="none" stroke-width="3"/>
<text x="774.0" y="239" font-size="16" fill="#111111" font-weight="400" text-anchor="middle">160</text>
<rect x="626.0" y="265" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="none" stroke-width="3"/>
<text x="654.0" y="299" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<rect x="686.0" y="265" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="none" stroke-width="3"/>
<text x="714.0" y="299" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<rect x="746.0" y="265" width="56" height="56" rx="3" fill="rgb(160,160,160)" stroke="none" stroke-width="3"/>
<text x="774.0" y="299" font-size="16" fill="#111111" font-weight="400" text-anchor="middle">160</text>
<text x="512" y="353" font-size="15" fill="#183247" font-weight="400" text-anchor="start">Horizontal sum: 960; vertical: 0</text>
<text x="512" y="390" font-size="21" fill="#17618c" font-weight="700" text-anchor="start">Gradient response = 3600</text>
<text x="512" y="429" font-size="16" fill="#183247" font-weight="400" text-anchor="start">The sides differ consistently.</text><text x="512" y="455" font-size="16" fill="#183247" font-weight="400" text-anchor="start">3600 exceeds the threshold 256.</text><text x="512" y="481" font-size="16" fill="#183247" font-weight="400" text-anchor="start">Keep the center unchanged.</text>
<text x="20" y="580" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">Calculated from brightness R + 2G + B.</text><text x="20" y="602" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">Upstream protection; libsixel needs -e 100 for these thresholds.</text>
</svg>
