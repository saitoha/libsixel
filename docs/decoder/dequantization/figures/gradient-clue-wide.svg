<svg xmlns="http://www.w3.org/2000/svg" width="960" height="635" viewBox="0 0 960 635" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Dots or a coherent boundary?</title>
<desc id="desc">At the center, an 80/160 checkerboard has response 0; an 80/160 vertical step has response 3600. The upstream gradient gate protects the step from mixing.</desc>
<rect x="0" y="0" width="960" height="635" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="20" y="36" font-size="23" fill="#183247" font-weight="700" text-anchor="start">Dots or a coherent boundary?</text>
<text x="20" y="64" font-size="16" fill="#4c6070" font-weight="400" text-anchor="start">Same shades. Different spatial structure.</text>
<rect x="24" y="90" width="440" height="455" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="40" y="121" font-size="20" fill="#183247" font-weight="700" text-anchor="start">Alternating dots</text>
<rect x="154.0" y="145" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="none" stroke-width="3"/>
<text x="182.0" y="179" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<rect x="214.0" y="145" width="56" height="56" rx="3" fill="rgb(160,160,160)" stroke="none" stroke-width="3"/>
<text x="242.0" y="179" font-size="16" fill="#111111" font-weight="400" text-anchor="middle">160</text>
<rect x="274.0" y="145" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="none" stroke-width="3"/>
<text x="302.0" y="179" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<rect x="154.0" y="205" width="56" height="56" rx="3" fill="rgb(160,160,160)" stroke="none" stroke-width="3"/>
<text x="182.0" y="239" font-size="16" fill="#111111" font-weight="400" text-anchor="middle">160</text>
<rect x="214.0" y="205" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="#855012" stroke-width="3"/>
<text x="242.0" y="239" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<rect x="274.0" y="205" width="56" height="56" rx="3" fill="rgb(160,160,160)" stroke="none" stroke-width="3"/>
<text x="302.0" y="239" font-size="16" fill="#111111" font-weight="400" text-anchor="middle">160</text>
<rect x="154.0" y="265" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="none" stroke-width="3"/>
<text x="182.0" y="299" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<rect x="214.0" y="265" width="56" height="56" rx="3" fill="rgb(160,160,160)" stroke="none" stroke-width="3"/>
<text x="242.0" y="299" font-size="16" fill="#111111" font-weight="400" text-anchor="middle">160</text>
<rect x="274.0" y="265" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="none" stroke-width="3"/>
<text x="302.0" y="299" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
<text x="40" y="353" font-size="15" fill="#183247" font-weight="400" text-anchor="start">Horizontal sum: 0; vertical: 0</text>
<text x="40" y="390" font-size="21" fill="#17618c" font-weight="700" text-anchor="start">Gradient response = 0</text>
<text x="40" y="429" font-size="16" fill="#183247" font-weight="400" text-anchor="start">Opposite sides cancel here.</text><text x="40" y="455" font-size="16" fill="#183247" font-weight="400" text-anchor="start">Center weight stays at 8.</text><text x="40" y="481" font-size="16" fill="#183247" font-weight="400" text-anchor="start">Palette evidence decides mixing.</text>
<rect x="496" y="90" width="440" height="455" rx="10" fill="#f6f8fa" stroke="#c8d0d7" stroke-width="1"/>
<text x="512" y="121" font-size="20" fill="#183247" font-weight="700" text-anchor="start">A vertical step</text>
<rect x="626.0" y="145" width="56" height="56" rx="3" fill="rgb(80,80,80)" stroke="none" stroke-width="3"/>
<text x="654.0" y="179" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">80</text>
