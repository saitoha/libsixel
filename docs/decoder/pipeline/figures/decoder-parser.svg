<rect x="70.0" y="350.0" width="310.0" height="145.0" rx="16.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="70.0" y="350.0" width="8.0" height="145.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="95.0" y="393.0" fill="#BE185D" font-size="24" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">&quot; raster</text><text x="95.0" y="428.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">declare width/height</text><text x="95.0" y="453.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">set aspect metadata</text>
<rect x="430.0" y="350.0" width="310.0" height="145.0" rx="16.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="430.0" y="350.0" width="8.0" height="145.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="455.0" y="393.0" fill="#BE185D" font-size="24" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start"># color</text><text x="455.0" y="428.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">select or redefine</text><text x="455.0" y="453.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">a color register</text>
<rect x="790.0" y="350.0" width="310.0" height="145.0" rx="16.0" fill="#FEF3C7" stroke="#D97706" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="790.0" y="350.0" width="8.0" height="145.0" rx="4.0" fill="#D97706" stroke="none"/><text x="815.0" y="393.0" fill="#D97706" font-size="24" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">! repeat</text><text x="815.0" y="428.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">set run length</text><text x="815.0" y="453.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">for next SIXEL</text>
<rect x="1150.0" y="350.0" width="310.0" height="145.0" rx="16.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="1150.0" y="350.0" width="8.0" height="145.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="1175.0" y="393.0" fill="#0F766E" font-size="24" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">? through ~</text><text x="1175.0" y="428.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">six vertical bits</text><text x="1175.0" y="453.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">paint at cursor x</text>
<rect x="430.0" y="585.0" width="310.0" height="145.0" rx="16.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="430.0" y="585.0" width="8.0" height="145.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="455.0" y="628.0" fill="#2563EB" font-size="24" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">$ carriage</text><text x="455.0" y="663.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">x = 0</text><text x="455.0" y="688.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">stay in six-row band</text>
<rect x="790.0" y="585.0" width="310.0" height="145.0" rx="16.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="790.0" y="585.0" width="8.0" height="145.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="815.0" y="628.0" fill="#2563EB" font-size="24" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">- next band</text><text x="815.0" y="663.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">x = 0</text><text x="815.0" y="688.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">y += 6</text>
