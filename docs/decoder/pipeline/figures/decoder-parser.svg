<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="840" viewBox="0 0 1540 840" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">SIXEL parser controls and state</title>
<desc id="figure-description">The DCS envelope enters the DECSIXEL body. Raster, color, repeat, paint, carriage-return, and next-band controls update shared decoder state.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1540.0" height="840.0" fill="#F8FAFC" stroke="none"/>
<text x="45.0" y="62.0" fill="#172033" font-size="38" font-weight="820" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">One byte stream, several kinds of state</text>
<text x="45.0" y="96.0" fill="#556176" font-size="20" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Controls update parser state; only SIXEL data bits paint pixels</text>
<rect x="80.0" y="145.0" width="77.0" height="52.0" rx="8.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/><text x="118.5" y="178.0" fill="#2563EB" font-size="15" font-weight="720" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">DCS q</text><rect x="165.0" y="145.0" width="92.0" height="52.0" rx="8.0" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.0"/><text x="211.0" y="178.0" fill="#BE185D" font-size="15" font-weight="720" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">&quot; raster</text><rect x="265.0" y="145.0" width="88.0" height="52.0" rx="8.0" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.0"/><text x="309.0" y="178.0" fill="#BE185D" font-size="15" font-weight="720" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle"># color</text><rect x="361.0" y="145.0" width="88.0" height="52.0" rx="8.0" fill="#FFFFFF" stroke="#D97706" stroke-width="2.0"/><text x="405.0" y="178.0" fill="#D97706" font-size="15" font-weight="720" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">! repeat</text><rect x="457.0" y="145.0" width="106.0" height="52.0" rx="8.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.0"/><text x="510.0" y="178.0" fill="#0F766E" font-size="15" font-weight="720" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">?–~ paint</text><rect x="571.0" y="145.0" width="50.0" height="52.0" rx="8.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/><text x="596.0" y="178.0" fill="#2563EB" font-size="15" font-weight="720" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ST</text>
<line x1="700.0" y1="171.0" x2="770.0" y2="171.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="775.0" y="128.0" width="300.0" height="126.0" rx="16.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="775.0" y="128.0" width="8.0" height="126.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="800.0" y="171.0" fill="#2563EB" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Envelope</text><text x="800.0" y="206.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">7-bit or 8-bit DCS</text><text x="800.0" y="231.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">q parameters + ST</text>
