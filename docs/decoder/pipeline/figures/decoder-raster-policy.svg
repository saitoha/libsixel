<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="790" viewBox="0 0 1540 790" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Declared raster and observed paint policy</title>
<desc id="figure-description">A four-by-five declared raster receives six painted rows. The default preserves the sixth row and reports it; trust-raster mode clips it and reports both paint-outside and clipped flags.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1540.0" height="790.0" fill="#F8FAFC" stroke="none"/>
<text x="45.0" y="62.0" fill="#172033" font-size="38" font-weight="820" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Declared bounds and painted extent can disagree</text>
<text x="45.0" y="96.0" fill="#556176" font-size="20" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A five-row declaration can still receive a six-bit SIXEL column</text>
<rect x="55.0" y="150.0" width="440.0" height="520.0" rx="18.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/>
