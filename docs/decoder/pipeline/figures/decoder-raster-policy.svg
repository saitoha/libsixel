<text x="83.0" y="230.0" fill="#556176" font-size="18" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">declares 4 × 5</text>
<rect x="550.0" y="150.0" width="440.0" height="520.0" rx="18.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/>
<text x="578.0" y="197.0" fill="#0F766E" font-size="27" font-weight="780" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Default policy</text>
<text x="578.0" y="230.0" fill="#556176" font-size="18" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">preserve 4 × 6</text>
