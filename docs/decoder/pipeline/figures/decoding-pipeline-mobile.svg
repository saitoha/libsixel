<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1450" viewBox="0 0 760 1450" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">SIXEL decoding mental model</title>
<desc id="figure-description">Portrait flow from SIXEL bytes through parser, painter, representation, and output policy to caller pixels or PNG output.</desc>
