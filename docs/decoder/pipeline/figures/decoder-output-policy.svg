<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Stateful decoder and CLI output policy</title>
<desc id="figure-description">Decoded state branches to stable indexed output, direct output for palette redefinition, or reconstruction, then optionally resizes and writes PNG.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1540.0" height="900.0" fill="#F8FAFC" stroke="none"/>
<text x="45.0" y="62.0" fill="#172033" font-size="38" font-weight="820" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The CLI adds policy after protocol decoding</text>
<text x="45.0" y="96.0" fill="#556176" font-size="20" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reconstruction, direct output, resize, and PNG writing are downstream choices</text>
<rect x="70.0" y="170.0" width="300.0" height="145.0" rx="16.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="70.0" y="170.0" width="8.0" height="145.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="95.0" y="213.0" fill="#2563EB" font-size="26" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Decoded state</text><text x="95.0" y="248.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">pixels + palette</text><text x="95.0" y="273.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">paint mask + flags</text>
<line x1="370.0" y1="242.0" x2="455.0" y2="242.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="460.0" y="170.0" width="330.0" height="145.0" rx="16.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="460.0" y="170.0" width="8.0" height="145.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="485.0" y="213.0" fill="#BE185D" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Representation choice</text><text x="485.0" y="248.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">stable palette?</text><text x="485.0" y="273.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">direct output requested?</text>
<rect x="930.0" y="125.0" width="340.0" height="145.0" rx="16.0" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="930.0" y="125.0" width="8.0" height="145.0" rx="4.0" fill="#BE185D" stroke="none"/><text x="955.0" y="168.0" fill="#BE185D" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Stable palette</text><text x="955.0" y="203.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PAL8 + palette</text><text x="955.0" y="228.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">small intermediate</text>
<rect x="930.0" y="335.0" width="340.0" height="145.0" rx="16.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="930.0" y="335.0" width="8.0" height="145.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="955.0" y="378.0" fill="#0F766E" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Direct / redefined</text><text x="955.0" y="413.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">RGBA8888</text><text x="955.0" y="438.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">preserve paint-time color</text>
<rect x="930.0" y="545.0" width="340.0" height="145.0" rx="16.0" fill="#FEF3C7" stroke="#D97706" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="930.0" y="545.0" width="8.0" height="145.0" rx="4.0" fill="#D97706" stroke="none"/><text x="955.0" y="588.0" fill="#D97706" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reconstruction</text><text x="955.0" y="623.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">k-undither / blur</text><text x="955.0" y="648.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">RGB or RGBA</text>
<path d="M 790 215 H 860 V 197 H 930" fill="none" stroke="#BE185D" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-magenta)"/>
<path d="M 790 242 H 835 V 407 H 930" fill="none" stroke="#0F766E" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 790 270 H 810 V 617 H 930" fill="none" stroke="#D97706" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)"/>
<path d="M 1100 270 V 305 H 1330 V 690 H 1110" fill="none" stroke="#BE185D" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-magenta)"/>
<path d="M 1270 407 H 1330 V 690 H 1110" fill="none" stroke="#0F766E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M 1270 617 H 1330 V 690 H 1110" fill="none" stroke="#D97706" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)"/>
<rect x="790.0" y="690.0" width="320.0" height="130.0" rx="16.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="790.0" y="690.0" width="8.0" height="130.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="815.0" y="733.0" fill="#2563EB" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Optional resize</text><text x="815.0" y="768.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">long edge = -s SIZE</text><text x="815.0" y="793.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">preserve aspect ratio</text>
<line x1="790.0" y1="755.0" x2="690.0" y2="755.0" stroke="#2563EB" stroke-width="5.0" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="365.0" y="690.0" width="325.0" height="130.0" rx="16.0" fill="#FEF3C7" stroke="#D97706" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="365.0" y="690.0" width="8.0" height="130.0" rx="4.0" fill="#D97706" stroke="none"/><text x="390.0" y="733.0" fill="#D97706" font-size="25" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PNG writer</text><text x="390.0" y="768.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">indexed, RGB, or RGBA</text><text x="390.0" y="793.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">stdout, path, clipboard</text>
<rect x="70.0" y="405.0" width="560.0" height="175.0" rx="16.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="95.0" y="446.0" fill="#172033" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Why high-color bypasses indexed reconstruction</text>
<text x="95.0" y="483.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A color register may change after earlier pixels use it.</text><text x="95.0" y="511.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">One final palette cannot reproduce both paint-time colors.</text><text x="95.0" y="539.0" fill="#556176" font-size="17" font-weight="470" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Direct decoding is therefore correctness, not decoration.</text>
</svg>
