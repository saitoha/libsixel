<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1160" viewBox="0 0 1760 1160" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Builtin evolved beyond one stb_image wrapper</title>
<desc id="figure-description">The builtin loader started from stb_image 1.33, then extracted animated GIF and later high-depth or metadata-sensitive PNG, HDR, PSD, BMP, and WebP paths. JPEG keeps a modified stb-derived float core, while TGA, PIC, and shared helpers remain adapted. In-tree control preserves precision and semantics but expands the parser attack surface.</desc>
