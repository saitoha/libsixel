<rect x="820.0" y="315.0" width="270.0" height="38.0" rx="19.0" fill="#FEE4E2" stroke="#B42318" stroke-width="1.5"/><text x="955.0" y="340.0" fill="#B42318" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">trailing ! bypasses append</text>
<rect x="35.0" y="390.0" width="1690.0" height="450.0" rx="20.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="53.0" y="408.0" width="8.0" height="24.0" rx="4.0" fill="#6941C6" stroke="none"/><text x="73.0" y="429.0" fill="#172033" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Probe and invoke candidates in chain order</text>
<rect x="70.0" y="535.0" width="240.0" height="120.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="70.0" y="535.0" width="7.0" height="120.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="92.0" y="569.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Next candidate</text><text x="92.0" y="600.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">component instance</text><text x="92.0" y="621.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">with resolved options</text>
<rect x="390.0" y="535.0" width="270.0" height="120.0" rx="15.0" fill="#EEF2F6" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="390.0" y="535.0" width="7.0" height="120.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="412.0" y="569.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Predicate</text><text x="412.0" y="600.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">does the byte prefix</text><text x="412.0" y="621.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">look applicable?</text>
<rect x="755.0" y="495.0" width="360.0" height="205.0" rx="15.0" fill="#F4EBFF" stroke="#6941C6" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="755.0" y="495.0" width="7.0" height="205.0" rx="3.5" fill="#6941C6" stroke="none"/><text x="777.0" y="529.0" fill="#6941C6" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Backend-owned load</text><text x="777.0" y="560.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">decode + metadata precedence</text><text x="777.0" y="581.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">CMS when supported</text><text x="777.0" y="602.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">animation + orientation</text><text x="777.0" y="623.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">alpha finalization</text>
<rect x="1215.0" y="440.0" width="430.0" height="120.0" rx="15.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="1215.0" y="440.0" width="7.0" height="120.0" rx="3.5" fill="#0F766E" stroke="none"/><text x="1237.0" y="474.0" fill="#0F766E" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SIXEL_OK: typed frame</text><text x="1237.0" y="505.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">pixelformat + colorspace + timing</text><text x="1237.0" y="526.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">palette and transparency metadata</text>
<rect x="1215.0" y="595.0" width="430.0" height="105.0" rx="15.0" fill="#FEE4E2" stroke="#B42318" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="1215.0" y="595.0" width="7.0" height="105.0" rx="3.5" fill="#B42318" stroke="none"/><text x="1237.0" y="629.0" fill="#B42318" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Allowed decode failure</text><text x="1237.0" y="660.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">reject this candidate</text><text x="1237.0" y="681.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">continue through the chain</text>
<rect x="1215.0" y="735.0" width="430.0" height="75.0" rx="15.0" fill="#FFFFFF" stroke="#B42318" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="1215.0" y="735.0" width="7.0" height="75.0" rx="3.5" fill="#B42318" stroke="none"/><text x="1237.0" y="769.0" fill="#B42318" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Terminal failure</text><text x="1237.0" y="800.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">return immediately; do not retry</text>
