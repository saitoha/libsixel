<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">How an image loader is selected</title>
<desc id="figure-description">Explicit loader entries are deduplicated and followed by compiled default-enabled loaders unless the list ends in an exclamation mark. Each candidate is predicate-gated and owns its decoding, metadata, color management, animation, orientation, and alpha work. Successful decoding returns a typed semantic frame; only recognized mismatch and decoder-family statuses permit fallback.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="1760.0" height="5000.0" fill="#F8FAFC" stroke="none"/>
<text x="42.0" y="60.0" fill="#172033" font-size="40" font-weight="820" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">How an image loader is selected</text>
<text x="42.0" y="92.0" fill="#556176" font-size="19" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">-L builds a chain; each backend owns its decode boundary</text>
<text x="1718.0" y="60.0" fill="#2563EB" font-size="15" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">LOADER MAP 1 / 2</text>
<rect x="35.0" y="125.0" width="1690.0" height="235.0" rx="20.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="53.0" y="143.0" width="8.0" height="24.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="73.0" y="164.0" fill="#172033" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Construct an ordered component chain</text>
<rect x="70.0" y="190.0" width="270.0" height="115.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="70.0" y="190.0" width="7.0" height="115.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="92.0" y="224.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">-L entries</text><text x="92.0" y="255.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">explicit order</text><text x="92.0" y="276.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">unique prefixes + suboptions</text>
<rect x="415.0" y="190.0" width="270.0" height="115.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="415.0" y="190.0" width="7.0" height="115.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="437.0" y="224.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Parse + deduplicate</text><text x="437.0" y="255.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">first occurrence wins</text><text x="437.0" y="276.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">environment, then CLI values</text>
<rect x="780.0" y="190.0" width="330.0" height="115.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="780.0" y="190.0" width="7.0" height="115.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="802.0" y="224.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Append compiled defaults</text><text x="802.0" y="255.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">registry order</text><text x="802.0" y="276.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">unless the complete list ends in !</text>
<rect x="1210.0" y="190.0" width="430.0" height="115.0" rx="15.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="1210.0" y="190.0" width="7.0" height="115.0" rx="3.5" fill="#0F766E" stroke="none"/><text x="1232.0" y="224.0" fill="#0F766E" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Candidate chain</text><text x="1232.0" y="255.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">libpng -&gt; ... -&gt; builtin -&gt; ...</text><text x="1232.0" y="276.0" fill="#556176" font-size="14" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">build-dependent; builtin always present</text>
