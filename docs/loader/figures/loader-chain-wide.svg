<rect x="35.0" y="870.0" width="1690.0" height="160.0" rx="20.0" fill="#CCFBF1" stroke="#CBD5E1" stroke-width="1.5"/><rect x="53.0" y="888.0" width="8.0" height="24.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="73.0" y="909.0" fill="#172033" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. The handoff is semantic, not a universal RGBA array</text>
