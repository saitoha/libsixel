<text x="75.0" y="1005.0" fill="#556176" font-size="16" font-weight="620" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Source depth, palette retention, CMS, alpha policy, and backend capabilities decide the concrete frame.</text>
