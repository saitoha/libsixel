<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2550" viewBox="0 0 760 2550" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Builtin lineage</title>
<desc id="figure-description">The builtin loader evolved from stb_image into dedicated and modified format paths. This permits precision, colorspace, palette, and animation control while increasing the amount of in-process parser code that must be audited and fuzzed.</desc>
