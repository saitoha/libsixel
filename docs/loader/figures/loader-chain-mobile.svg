<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2280" viewBox="0 0 760 2280" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Loader selection</title>
<desc id="figure-description">The loader order becomes an explicit and default-appended candidate chain. Candidates are predicate-gated, and each backend owns decoding and local normalization. A successful candidate returns a typed frame, an allowed decoder failure tries the next candidate, and terminal failures stop.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="760.0" height="5000.0" fill="#F8FAFC" stroke="none"/>
<text x="42.0" y="60.0" fill="#172033" font-size="40" font-weight="820" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Loader selection</text>
<text x="42.0" y="92.0" fill="#556176" font-size="19" font-weight="550" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Chain construction, fallback, typed output</text>
<text x="718.0" y="60.0" fill="#2563EB" font-size="15" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">MAP 1 / 2</text>
<rect x="30.0" y="120.0" width="700.0" height="570.0" rx="20.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="48.0" y="138.0" width="8.0" height="24.0" rx="4.0" fill="#2563EB" stroke="none"/><text x="68.0" y="159.0" fill="#172033" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Build the chain</text>
<rect x="105.0" y="180.0" width="550.0" height="105.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="180.0" width="7.0" height="105.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="127.0" y="214.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">-L entries</text><text x="127.0" y="245.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">explicit order; unique prefixes; suboptions</text>
<path d="M 380 285 V 330" fill="none" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="105.0" y="330.0" width="550.0" height="115.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="330.0" width="7.0" height="115.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="127.0" y="364.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Parse + deduplicate</text><text x="127.0" y="395.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">first occurrence wins</text><text x="127.0" y="417.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">environment defaults, then explicit values</text>
<path d="M 380 445 V 490" fill="none" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="105.0" y="490.0" width="550.0" height="115.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="490.0" width="7.0" height="115.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="127.0" y="524.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Append compiled defaults</text><text x="127.0" y="555.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">registry order unless final !</text><text x="127.0" y="577.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">builtin is always registered</text>
<path d="M 380 605 V 640" fill="none" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="210.0" y="635.0" width="340.0" height="38.0" rx="19.0" fill="#FEE4E2" stroke="#B42318" stroke-width="1.5"/><text x="380.0" y="660.0" fill="#B42318" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">final ! closes the chain</text>
<rect x="30.0" y="730.0" width="700.0" height="990.0" rx="20.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><rect x="48.0" y="748.0" width="8.0" height="24.0" rx="4.0" fill="#6941C6" stroke="none"/><text x="68.0" y="769.0" fill="#172033" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Try candidates</text>
<rect x="105.0" y="790.0" width="550.0" height="105.0" rx="15.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="790.0" width="7.0" height="105.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="127.0" y="824.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Next candidate</text><text x="127.0" y="855.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">component + resolved options</text>
<path d="M 380 895 V 940" fill="none" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="105.0" y="940.0" width="550.0" height="105.0" rx="15.0" fill="#EEF2F6" stroke="#2563EB" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="940.0" width="7.0" height="105.0" rx="3.5" fill="#2563EB" stroke="none"/><text x="127.0" y="974.0" fill="#2563EB" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Predicate matches?</text><text x="127.0" y="1005.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">false skips the decoder</text>
<path d="M 380 1045 V 1090" fill="none" stroke="#2563EB" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="405.0" y="1052.0" width="90.0" height="38.0" rx="19.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="450.0" y="1077.0" fill="#2563EB" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">yes</text>
<rect x="105.0" y="1090.0" width="550.0" height="175.0" rx="15.0" fill="#F4EBFF" stroke="#6941C6" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="1090.0" width="7.0" height="175.0" rx="3.5" fill="#6941C6" stroke="none"/><text x="127.0" y="1124.0" fill="#6941C6" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Backend-owned load</text><text x="127.0" y="1155.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">decode + metadata precedence</text><text x="127.0" y="1177.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">CMS + animation + orientation</text><text x="127.0" y="1199.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">alpha finalization when supported</text>
<text x="105.0" y="1300.0" fill="#556176" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">One of three decode outcomes:</text>
<rect x="105.0" y="1325.0" width="550.0" height="105.0" rx="15.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="1325.0" width="7.0" height="105.0" rx="3.5" fill="#0F766E" stroke="none"/><text x="127.0" y="1359.0" fill="#0F766E" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SIXEL_OK</text><text x="127.0" y="1390.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">return a typed semantic frame</text>
<rect x="105.0" y="1465.0" width="550.0" height="105.0" rx="15.0" fill="#FEE4E2" stroke="#B42318" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="1465.0" width="7.0" height="105.0" rx="3.5" fill="#B42318" stroke="none"/><text x="127.0" y="1499.0" fill="#B42318" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Allowed decode failure</text><text x="127.0" y="1530.0" fill="#556176" font-size="15" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">advance to the next candidate</text>
<path d="M 105 1517 H 70 V 842 H 105" fill="none" stroke="#B42318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-blue)"/>
<rect x="70.0" y="1060.0" width="160.0" height="38.0" rx="19.0" fill="#FEE4E2" stroke="#B42318" stroke-width="1.5"/><text x="150.0" y="1085.0" fill="#B42318" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">no: next</text>
<path d="M 105 1010 H 70 V 842 H 105" fill="none" stroke="#B42318" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow-blue)"/>
<rect x="105.0" y="1605.0" width="550.0" height="75.0" rx="15.0" fill="#FFFFFF" stroke="#B42318" stroke-width="2.0" filter="url(#card-shadow)"/><rect x="105.0" y="1605.0" width="7.0" height="75.0" rx="3.5" fill="#B42318" stroke="none"/><text x="127.0" y="1639.0" fill="#B42318" font-size="18" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Terminal failure: stop</text><text x="127.0" y="1670.0" fill="#556176" font-size="13" font-weight="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">allocation, cancellation, arguments, overflow, ...</text>
<rect x="30.0" y="1750.0" width="700.0" height="455.0" rx="20.0" fill="#CCFBF1" stroke="#CBD5E1" stroke-width="1.5"/><rect x="48.0" y="1768.0" width="8.0" height="24.0" rx="4.0" fill="#0F766E" stroke="none"/><text x="68.0" y="1789.0" fill="#172033" font-size="20" font-weight="760" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. Output contract</text>
<rect x="105.0" y="1820.0" width="550.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="380.0" y="1845.0" fill="#0F766E" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PAL + indexed pixels</text>
<rect x="105.0" y="1890.0" width="550.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="380.0" y="1915.0" fill="#0F766E" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">RGB888 + separate transparency</text>
<rect x="105.0" y="1960.0" width="550.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="380.0" y="1985.0" fill="#0F766E" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">RGBFLOAT32 or typed float32</text>
<rect x="105.0" y="2030.0" width="550.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="380.0" y="2055.0" fill="#0F766E" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">temporary alpha-bearing layout</text>
<rect x="105.0" y="2100.0" width="550.0" height="38.0" rx="19.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="380.0" y="2125.0" fill="#0F766E" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">colorspace + timing + metadata</text>
<text x="105.0" y="2188.0" fill="#556176" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Never infer RGBA from the loader name.</text>
</svg>
