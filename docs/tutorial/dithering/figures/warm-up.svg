<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Each band has its own history</title>
<desc id="figure-description">Three bands of rows; each band after the first has a worker that starts above it on warm-up rows it does not keep.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="720.0" height="606.0" fill="#F8FAFC" stroke="none"/>
<text x="32.0" y="50.0" fill="#172033" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Each band has its own history</text><text x="32.0" y="80.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A worker starts above its band and throws those rows away.</text>
<rect x="150.0" y="120.0" width="400.0" height="110.0" rx="4.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/>
<text x="350.0" y="181.0" fill="#2563EB" font-size="16" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">rows this worker keeps</text>
<text x="32.0" y="181.0" fill="#172033" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Band 1</text>
<rect x="150.0" y="262.0" width="400.0" height="110.0" rx="4.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.0"/>
<text x="350.0" y="323.0" fill="#0F766E" font-size="16" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">rows this worker keeps</text>
<text x="32.0" y="323.0" fill="#172033" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Band 2</text>
<rect x="190.0" y="204.0" width="320.0" height="58.0" rx="4.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="350.0" y="239.0" fill="#172033" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">warm-up rows, computed and not kept</text>
<rect x="150.0" y="404.0" width="400.0" height="110.0" rx="4.0" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.0"/>
<text x="350.0" y="465.0" fill="#BE185D" font-size="16" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">rows this worker keeps</text>
<text x="32.0" y="465.0" fill="#172033" font-size="17" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Band 3</text>
<rect x="190.0" y="346.0" width="320.0" height="58.0" rx="4.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="350.0" y="381.0" fill="#172033" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">warm-up rows, computed and not kept</text>
<text x="32.0" y="556.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A band starts with no error from above. Warm-up rows let its pattern</text>
<text x="32.0" y="582.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">get going first. No two workers ever share error, so none has to wait.</text>
</svg>
