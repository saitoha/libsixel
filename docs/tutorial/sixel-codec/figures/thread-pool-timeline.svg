<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Keep the threads</title>
<desc id="figure-description">Three pictures encoded by the caller and one helper. Starting the helper for each picture delays every picture; a helper that stays is started once and then waits for the next picture.</desc>
