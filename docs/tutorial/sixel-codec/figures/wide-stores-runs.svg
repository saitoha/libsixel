<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Write a node in wide stores</title>
<desc id="figure-description">A node&#x27;s sixteen column values. Lanes that equal the next three start a long run. The columns before the first one, DDK, are written with one store; the run of 6 becomes !6g.</desc>
