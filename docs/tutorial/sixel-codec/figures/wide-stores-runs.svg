<text x="40.0" y="296.0" fill="#172033" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">lanes 0 to 2 are short runs: one 16-byte store writes their characters</text>
<text x="40.0" y="340.0" fill="#0F766E" font-size="22" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">DDK</text>
<text x="112.0" y="340.0" fill="#BE185D" font-size="22" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">!6g</text>
<text x="40.0" y="380.0" fill="#556176" font-size="16" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">lane 3 starts a run of 6: written as !6g by the usual code, then the next sixteen</text>
<text x="40.0" y="438.0" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A run of three or fewer is written as plain copies anyway, so a</text><text x="40.0" y="460.4" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">block without a long run is exactly its sixteen characters.</text>
