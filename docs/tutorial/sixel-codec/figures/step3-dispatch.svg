<text x="32.0" y="50.0" fill="#172033" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">How many questions per byte?</text><text x="32.0" y="80.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Most bytes of a stream are data characters in a row.</text>
<text x="32.0" y="134.0" fill="#556176" font-size="15" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">the stream</text>
