<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">How many questions per byte?</title>
<desc id="figure-description">The stream #1~N^}^NE$ handled two ways. Returning to the dispatch asks a question for every byte; an inner loop reads #1 at once and handles the seven data characters in one loop.</desc>
