<text x="32.0" y="462.0" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Fewer questions leave fewer chances for a wrong guess by the</text><text x="32.0" y="484.4" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">processor, and the loop body can run without returning to the top.</text>
