<text x="614.0" y="172.0" fill="#556176" font-size="15" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">… 22 more</text>
<path d="M 32 190 L 32 200 L 650 200 L 650 190" fill="none" stroke="#D97706" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32.0" y="226.0" fill="#D97706" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">buf_reserve(out, 7 + 32): 39 bytes, asked once</text>
<text x="32.0" y="266.0" fill="#556176" font-size="15" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">teal: the 12 bytes written, the color, the blank run, the node&#x27;s characters</text>
<text x="32.0" y="292.0" fill="#556176" font-size="15" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">grey: the two extra copies of a short run, overwritten by what comes next</text>
<text x="32.0" y="348.0" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A node never needs more than one byte per column plus a color</text><text x="32.0" y="370.4" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">selection and a run of blank columns, so the writes cannot overflow.</text>
</svg>
