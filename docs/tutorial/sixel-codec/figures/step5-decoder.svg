<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Decoding with helpers: find the bands first</title>
<desc id="figure-description">A short stream with five bands. A prescan records the byte offset and selected color at each band start; threads then decode slices of bands in parallel, with a serial fallback.</desc>
