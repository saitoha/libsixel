<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Encoding with four helpers</title>
<desc id="figure-description">Twelve bands are split into four ranges. Each thread encodes its range into its own buffer, and the buffers are joined in order.</desc>
