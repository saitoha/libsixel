<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Visiting each color once</title>
<desc id="figure-description">In the column 5, 2, 2, 5, 7, 2 rows 0, 1 and 4 start a new color, so the column is visited for colors 5, 2 and 7 only.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="720.0" height="520.0" fill="#F8FAFC" stroke="none"/>
<text x="32.0" y="50.0" fill="#172033" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Visiting each color once</text><text x="32.0" y="80.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A row is new if no row above it has the same color.</text>
<rect x="70.0" y="120.0" width="48.0" height="48.0" rx="3.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="94.0" y="151.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">5</text>
<text x="58.0" y="150.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 0</text>
<text x="140.0" y="152.0" fill="#0F766E" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">new color</text>
<rect x="70.0" y="172.0" width="48.0" height="48.0" rx="3.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="94.0" y="203.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text>
<text x="58.0" y="202.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 1</text>
<text x="140.0" y="204.0" fill="#0F766E" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">new color</text>
<rect x="70.0" y="224.0" width="48.0" height="48.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="94.0" y="255.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text>
<text x="58.0" y="254.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 2</text>
<text x="140.0" y="256.0" fill="#556176" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">same as row 1</text>
<rect x="70.0" y="276.0" width="48.0" height="48.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="94.0" y="307.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">5</text>
<text x="58.0" y="306.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 3</text>
<text x="140.0" y="308.0" fill="#556176" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">same as row 0</text>
<rect x="70.0" y="328.0" width="48.0" height="48.0" rx="3.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="94.0" y="359.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">7</text>
<text x="58.0" y="358.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 4</text>
<text x="140.0" y="360.0" fill="#0F766E" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">new color</text>
<rect x="70.0" y="380.0" width="48.0" height="48.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="94.0" y="411.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text>
<text x="58.0" y="410.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 5</text>
<text x="140.0" y="412.0" fill="#556176" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">same as row 1</text>
<rect x="320.0" y="130.0" width="368.0" height="250.0" rx="14.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="340.0" y="165.0" fill="#172033" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">So this column needs</text>
<text x="340.0" y="192.0" fill="#172033" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3 visits, not 6:</text>
<text x="340.0" y="240.0" fill="#0F766E" font-size="20" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">color 5: 001001 &#x27;H&#x27;</text>
<text x="340.0" y="280.0" fill="#0F766E" font-size="20" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">color 2: 100110 &#x27;e&#x27;</text>
<text x="340.0" y="320.0" fill="#0F766E" font-size="20" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">color 7: 010000 &#x27;O&#x27;</text>
<text x="32.0" y="460.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The code compares the word with copies of itself shifted down</text><text x="32.0" y="483.8" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">by 1 to 5 rows, which tests every pair of rows at once.</text>
</svg>
