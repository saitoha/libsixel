<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Finding the next node</title>
<desc id="figure-description">After the first line, nodes start at columns 0, 3, 7, 13, 20. For line 2 a bit scan jumps from the cursor to the next start, taking #1, #2, #3, #2; #4 at column 3 waits for line 3.</desc>
