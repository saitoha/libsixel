<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Painting one character without guessing</title>
<desc id="figure-description">The character e sets rows 1, 2 and 5. A branch chooses paint or skip for each row. A mask of ff or 00 writes every row the same way, with no choice to predict.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="720.0" height="500.0" fill="#F8FAFC" stroke="none"/>
<text x="32.0" y="50.0" fill="#172033" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Painting one character without guessing</text><text x="32.0" y="80.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">&#x27;e&#x27; is 100110: rows 1, 2 and 5 get color 3.</text>
<text x="32.0" y="126.0" fill="#556176" font-size="15" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">row</text>
<text x="92.0" y="126.0" fill="#556176" font-size="15" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">bit</text>
<text x="160.0" y="126.0" fill="#556176" font-size="15" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">with a branch</text>
<text x="360.0" y="126.0" fill="#556176" font-size="15" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">with a mask</text>
<text x="590.0" y="126.0" fill="#556176" font-size="15" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">result</text>
<text x="32.0" y="164.0" fill="#172033" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">0</text>
<rect x="92.0" y="138.0" width="36.0" height="36.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="110.0" y="162.5" fill="#556176" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text>
<text x="160.0" y="163.0" fill="#BE185D" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">skip</text>
<text x="360.0" y="163.0" fill="#0F766E" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">mask = 00</text>
<rect x="590.0" y="138.0" width="36.0" height="36.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="608.0" y="162.5" fill="#556176" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">5</text>
<text x="32.0" y="208.0" fill="#172033" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1</text>
<rect x="92.0" y="182.0" width="36.0" height="36.0" rx="3.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/><text x="110.0" y="206.5" fill="#D97706" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">1</text>
<text x="160.0" y="207.0" fill="#BE185D" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">paint</text>
<text x="360.0" y="207.0" fill="#0F766E" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">mask = ff</text>
<rect x="590.0" y="182.0" width="36.0" height="36.0" rx="3.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="608.0" y="206.5" fill="#0F766E" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">3</text>
<text x="32.0" y="252.0" fill="#172033" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2</text>
<rect x="92.0" y="226.0" width="36.0" height="36.0" rx="3.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/><text x="110.0" y="250.5" fill="#D97706" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">1</text>
<text x="160.0" y="251.0" fill="#BE185D" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">paint</text>
<text x="360.0" y="251.0" fill="#0F766E" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">mask = ff</text>
<rect x="590.0" y="226.0" width="36.0" height="36.0" rx="3.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="608.0" y="250.5" fill="#0F766E" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">3</text>
<text x="32.0" y="296.0" fill="#172033" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3</text>
<rect x="92.0" y="270.0" width="36.0" height="36.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="110.0" y="294.5" fill="#556176" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text>
<text x="160.0" y="295.0" fill="#BE185D" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">skip</text>
<text x="360.0" y="295.0" fill="#0F766E" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">mask = 00</text>
<rect x="590.0" y="270.0" width="36.0" height="36.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="608.0" y="294.5" fill="#556176" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">5</text>
<text x="32.0" y="340.0" fill="#172033" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">4</text>
<rect x="92.0" y="314.0" width="36.0" height="36.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="110.0" y="338.5" fill="#556176" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text>
<text x="160.0" y="339.0" fill="#BE185D" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">skip</text>
<text x="360.0" y="339.0" fill="#0F766E" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">mask = 00</text>
<rect x="590.0" y="314.0" width="36.0" height="36.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="608.0" y="338.5" fill="#556176" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">7</text>
<text x="32.0" y="384.0" fill="#172033" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">5</text>
<rect x="92.0" y="358.0" width="36.0" height="36.0" rx="3.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/><text x="110.0" y="382.5" fill="#D97706" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">1</text>
<text x="160.0" y="383.0" fill="#BE185D" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">paint</text>
<text x="360.0" y="383.0" fill="#0F766E" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">mask = ff</text>
<rect x="590.0" y="358.0" width="36.0" height="36.0" rx="3.0" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2"/><text x="608.0" y="382.5" fill="#0F766E" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">3</text>
<text x="32.0" y="420.0" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The branch makes the processor guess paint or skip six times per</text><text x="32.0" y="442.4" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">character. The mask does the same work every time, so there is</text><text x="32.0" y="464.8" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">nothing to guess: *q = (*q &amp; ~mask) | (color &amp; mask);</text>
</svg>
