<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">How fast does it get?</title>
<desc id="figure-description">Bar chart of large photographs encoded and decoded per second at each step: encode 3, 64, 65, 79, 459; decode 30, 81, 126, 142, 505.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="720.0" height="580.0" fill="#F8FAFC" stroke="none"/>
<text x="32.0" y="50.0" fill="#172033" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">How fast does it get?</text><text x="32.0" y="80.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Large photographs (2400 × 1800) per second, more is better</text>
<text x="160.0" y="122.0" fill="#2563EB" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">encode</text>
<text x="260.0" y="122.0" fill="#BE185D" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">decode</text>
<text x="32.0" y="174.0" fill="#172033" font-size="19" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 1</text>
<rect x="130.0" y="140.0" width="3.0" height="26.0" rx="4.0" fill="#2563EB" stroke="none"/>
<text x="141.0" y="159.0" fill="#2563EB" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3</text>
