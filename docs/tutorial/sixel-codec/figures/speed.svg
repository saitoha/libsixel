<text x="32.0" y="246.0" fill="#172033" font-size="19" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 2</text>
<rect x="130.0" y="212.0" width="54.2" height="26.0" rx="4.0" fill="#2563EB" stroke="none"/>
<text x="192.2" y="231.0" fill="#2563EB" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">64</text>
