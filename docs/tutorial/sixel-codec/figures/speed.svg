<text x="193.3" y="303.0" fill="#2563EB" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">65</text>
<rect x="130.0" y="314.0" width="106.4" height="26.0" rx="4.0" fill="#BE185D" stroke="none"/>
<text x="244.4" y="333.0" fill="#BE185D" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">126</text>
<text x="32.0" y="390.0" fill="#172033" font-size="19" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 4</text>
<rect x="130.0" y="356.0" width="66.6" height="26.0" rx="4.0" fill="#2563EB" stroke="none"/>
