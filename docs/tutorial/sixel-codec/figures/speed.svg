<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">How fast does it get?</title>
<desc id="figure-description">Bar chart of Full HD photographs encoded and decoded per second at each step: encode 5, 45, 47, 85, 93, 418; decode 18, 87, 240, 326, 375, 1887.</desc>
