<text x="32.0" y="520.0" fill="#556176" font-size="15" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Measured on an Apple M3 Max. Step 5 uses all cores; the</text><text x="32.0" y="541.0" fill="#556176" font-size="15" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">others use one. The README table lists every input.</text>
