<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">SIMD: one instruction, sixteen answers</title>
<desc id="figure-description">Sixteen pixels are compared with color 2 in one instruction. Equal lanes become ff, and movemask packs them into a sixteen-bit number.</desc>
