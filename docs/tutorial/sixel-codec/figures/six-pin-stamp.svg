<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">A stamp with six pins</title>
<desc id="figure-description">A column of six pixels. Rows 1, 2 and 4 are painted, worth 2, 4 and 16. Their sum 22 plus 63 is 85, the character U.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="720.0" height="560.0" fill="#F8FAFC" stroke="none"/>
<text x="32.0" y="50.0" fill="#172033" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A stamp with six pins</text><text x="32.0" y="80.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Each character paints one column, six pixels tall.</text>
<text x="86.0" y="116.0" fill="#556176" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">pins</text>
<rect x="60.0" y="130.0" width="52.0" height="52.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="86.0" y="165.4" fill="#556176" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text>
<text x="46.0" y="162.0" fill="#556176" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 0</text>
<text x="142.0" y="163.0" fill="#556176" font-size="19" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">worth 1</text>
<rect x="60.0" y="188.0" width="52.0" height="52.0" rx="3.0" fill="#DC2626" stroke="#CBD5E1" stroke-width="1.2"/><text x="86.0" y="223.4" fill="#FFFFFF" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">1</text>
<text x="46.0" y="220.0" fill="#556176" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 1</text>
<text x="142.0" y="221.0" fill="#172033" font-size="19" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">worth 2</text>
<rect x="60.0" y="246.0" width="52.0" height="52.0" rx="3.0" fill="#DC2626" stroke="#CBD5E1" stroke-width="1.2"/><text x="86.0" y="281.4" fill="#FFFFFF" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">1</text>
<text x="46.0" y="278.0" fill="#556176" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 2</text>
<text x="142.0" y="279.0" fill="#172033" font-size="19" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">worth 4</text>
<rect x="60.0" y="304.0" width="52.0" height="52.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="86.0" y="339.4" fill="#556176" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text>
<text x="46.0" y="336.0" fill="#556176" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 3</text>
<text x="142.0" y="337.0" fill="#556176" font-size="19" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">worth 8</text>
<rect x="60.0" y="362.0" width="52.0" height="52.0" rx="3.0" fill="#DC2626" stroke="#CBD5E1" stroke-width="1.2"/><text x="86.0" y="397.4" fill="#FFFFFF" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">1</text>
<text x="46.0" y="394.0" fill="#556176" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 4</text>
<text x="142.0" y="395.0" fill="#172033" font-size="19" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">worth 16</text>
<rect x="60.0" y="420.0" width="52.0" height="52.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="86.0" y="455.4" fill="#556176" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text>
<text x="46.0" y="452.0" fill="#556176" font-size="15" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 5</text>
<text x="142.0" y="453.0" fill="#556176" font-size="19" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">worth 32</text>
<path d="M 240 140 h 20 v 322 h -20" fill="none" stroke="#556176" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="260.0" y="150.0" width="428.0" height="290.0" rx="14.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
<text x="285.0" y="190.0" fill="#172033" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Add up the lit pins:</text>
<text x="285.0" y="230.0" fill="#2563EB" font-size="24" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">2 + 4 + 16 = 22</text>
<text x="285.0" y="280.0" fill="#172033" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Add 63 to make it a letter:</text>
<text x="285.0" y="320.0" fill="#2563EB" font-size="24" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">22 + 63 = 85</text>
<text x="285.0" y="360.0" fill="#2563EB" font-size="24" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">character 85 is &#x27;U&#x27;</text>
<text x="285.0" y="410.0" fill="#556176" font-size="17" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Row 0, the top pin, is worth 1.</text>
<text x="32.0" y="505.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Six pins give 64 patterns (0 to 63), so every column fits in</text><text x="32.0" y="528.8" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">one printable character from &#x27;?&#x27; (0) to &#x27;~&#x27; (63).</text>
</svg>
