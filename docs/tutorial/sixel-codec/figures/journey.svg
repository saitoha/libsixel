<svg xmlns="http://www.w3.org/2000/svg" width="720" height="634" viewBox="0 0 720 634" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">The journey</title>
<desc id="figure-description">The chapters grouped into parts: A working codec: by-hand, first-codec; A better plan: nodes, packing, full-decoder; Less wasted work: fewer-questions, masks, next-node, occupancy, direct-writes; Wider words: word-decoder, vector-lanes, transpose, number-load, literal-lanes, wide-stores; More cores: parallel-bands, parallel-decoder, thread-pool; Fewer bytes: overpaint.</desc>
