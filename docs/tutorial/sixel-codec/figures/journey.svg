<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">The journey</title>
<desc id="figure-description">Seven lessons as a staircase: 0 read SIXEL by hand, 1 a simple codec, 2 nodes, 3 fewer decisions, 4 64-bit words, 5 SIMD, 6 threads.</desc>
