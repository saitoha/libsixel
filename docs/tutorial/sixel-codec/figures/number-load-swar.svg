<rect x="220.0" y="342.0" width="64.0" height="64.0" rx="3.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="252.0" y="380.5" fill="#556176" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">77</text>
