<text x="32.0" y="506.0" fill="#172033" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The first byte with its top bit set is byte 3, so the number has 3 digits:</text>
<text x="32.0" y="546.0" fill="#0F766E" font-size="20" font-weight="750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" xml-space="preserve">1×100 + 2×10 + 3×1 = 123</text>
<text x="32.0" y="588.0" fill="#556176" font-size="15" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">No digit is looked at by itself; the same arithmetic works for 1, 2 or 3 digits.</text>
