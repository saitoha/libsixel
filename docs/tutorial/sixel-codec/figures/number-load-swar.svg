<rect x="436.0" y="342.0" width="64.0" height="64.0" rx="3.0" fill="#FEF3C7" stroke="#BE185D" stroke-width="1.2"/><text x="468.0" y="380.5" fill="#172033" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">94</text>
