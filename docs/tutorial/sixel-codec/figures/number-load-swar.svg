<rect x="292.0" y="120.0" width="64.0" height="64.0" rx="3.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="324.0" y="158.5" fill="#172033" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">&#x27;2&#x27;</text>
<rect x="364.0" y="120.0" width="64.0" height="64.0" rx="3.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="396.0" y="158.5" fill="#172033" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">&#x27;3&#x27;</text>
<rect x="436.0" y="120.0" width="64.0" height="64.0" rx="3.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="468.0" y="158.5" fill="#172033" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">&#x27;N&#x27;</text>
<text x="204.0" y="234.0" fill="#556176" font-size="16" font-weight="750" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">hex</text>
