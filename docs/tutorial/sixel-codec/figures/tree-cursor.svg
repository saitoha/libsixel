<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Two colors, two bands</title>
<desc id="figure-description">The tree split into two six-row bands. The cursor paints band 1 in green, moves down with -, paints green, returns with $, and paints the brown trunk. Body: #1_s}~}s_-#1!7@$#2??O]O</desc>
