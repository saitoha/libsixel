<text x="185.0" y="290.0" fill="#2563EB" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">turn</text>
<rect x="630.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="653.0" y="209.1" fill="#172033" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">5</text><text x="653.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 0</text><rect x="580.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="603.0" y="209.1" fill="#172033" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text><text x="603.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 1</text><rect x="530.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="553.0" y="209.1" fill="#172033" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text><text x="553.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 2</text><rect x="480.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="503.0" y="209.1" fill="#172033" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">5</text><text x="503.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 3</text><rect x="430.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="453.0" y="209.1" fill="#172033" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">7</text><text x="453.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 4</text><rect x="380.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="403.0" y="209.1" fill="#172033" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text><text x="403.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 5</text><rect x="330.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="353.0" y="209.1" fill="#556176" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text><text x="353.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 6</text><rect x="280.0" y="180.0" width="46.0" height="46.0" rx="3.0" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/><text x="303.0" y="209.1" fill="#556176" font-size="17" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">0</text><text x="303.0" y="172.0" fill="#556176" font-size="11" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">byte 7</text>
<text x="280.0" y="260.0" fill="#556176" font-size="15" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">one uint64_t: 8 bytes, the top two unused</text>
<rect x="32.0" y="440.0" width="656.0" height="95.0" rx="14.0" fill="#FFFFFF" stroke="#BE185D" stroke-width="1.6"/>
<text x="52.0" y="475.0" fill="#172033" font-size="17" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A band of width w becomes w numbers in a row. A 64-bit CPU</text><text x="52.0" y="498.8" fill="#172033" font-size="17" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">handles a whole number in one step, so it sees 6 pixels at once.</text>
</svg>
