<text x="50.0" y="340.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 4</text>
<rect x="60.0" y="360.0" width="44.0" height="44.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="82.0" y="389.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text>
