<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Six pixels in one number</title>
<desc id="figure-description">A column with palette indexes 5, 2, 2, 5, 7, 2 is packed into the low six bytes of one 64-bit word, row 0 in byte 0.</desc>
<defs ><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/></filter></defs>
<rect x="0.0" y="0.0" width="720.0" height="560.0" fill="#F8FAFC" stroke="none"/>
<text x="32.0" y="50.0" fill="#172033" font-size="28" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Six pixels in one number</text><text x="32.0" y="80.0" fill="#556176" font-size="18" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Turn each column on its side and put it in a box of 8 bytes.</text>
<rect x="60.0" y="120.0" width="44.0" height="44.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="82.0" y="149.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">5</text>
<text x="50.0" y="148.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 0</text>
<rect x="60.0" y="168.0" width="44.0" height="44.0" rx="3.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="82.0" y="197.2" fill="#172033" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" xml-space="preserve">2</text>
<text x="50.0" y="196.0" fill="#556176" font-size="14" font-weight="650" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">row 1</text>
