<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Reading a heart column by column</title>
<desc id="figure-description">A seven by six heart. Column sums are 6, 15, 31, 62, 31, 15, 6; adding 63 gives the characters EN^}^NE.</desc>
