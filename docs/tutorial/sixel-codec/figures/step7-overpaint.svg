<svg xmlns="http://www.w3.org/2000/svg" width="720" height="668" viewBox="0 0 720 668" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Filling the first line, then repairing</title>
<desc id="figure-description">The first graphics line fills all eight columns with the sky color. The second repaints the ground and the third the sun, so the band ends with the same pixels. Body with masks: #0NN^^^NKK$#2oo___ooo$#1!6?BB. Body with the fill: #0!8~$#2oo___ooo$#1!6?BB.</desc>
