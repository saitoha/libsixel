<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Sorting pixels into drawers</title>
<desc id="figure-description">An eight by six band is read once. Each pixel ORs its row weight into map[color][x], giving one row of column values per color.</desc>
