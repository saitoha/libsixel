<text x="52.0" y="468.0" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The pixel at row 4, column 0 is grass, so the grass drawer</text><text x="52.0" y="490.4" fill="#556176" font-size="16" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">at column 0 gets +16. The image is read only once.</text>
<text x="32.0" y="550.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">After the band, each drawer holds the finished column values;</text><text x="32.0" y="573.8" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">a zero means the color is absent from that column.</text>
