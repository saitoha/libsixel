<text x="32.0" y="360.0" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Image rows lie one after another in memory, so one row of</text><text x="32.0" y="383.8" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">eight pixels is eight neighbouring bytes: one memset() call.</text><text x="32.0" y="407.6" fill="#556176" font-size="17" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">A single character (no !) still uses plain stores.</text>
</svg>
