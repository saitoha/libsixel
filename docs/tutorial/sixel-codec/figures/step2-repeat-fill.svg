<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Painting !8~ quickly</title>
<desc id="figure-description">A repeated full column fills an eight by six block. Pixel by pixel needs 48 stores; row by row needs six memset calls.</desc>
