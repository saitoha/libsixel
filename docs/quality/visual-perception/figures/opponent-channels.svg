<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Opponent channels</title>
<desc id="desc">L, M and S cone signals combine into a light-dark channel, L plus M; a red-green channel, L minus M; and a blue-yellow channel, S minus L plus M.</desc>
<rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4c6070"/></marker></defs>
<circle cx="170" cy="70" r="38" fill="#c0392b"/>
<text x="170" y="78" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">L</text>
<circle cx="360" cy="70" r="38" fill="#2e8b57"/>
<text x="360" y="78" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">M</text>
<circle cx="550" cy="70" r="38" fill="#2f5fb3"/>
<text x="550" y="78" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">S</text>
<text x="360" y="20" font-size="15" fill="#4c6070" font-weight="400" text-anchor="middle">Cone signals</text>
<path d="M 170 110 L 117 184" stroke="#4c6070" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="128.66" cy="167.72" r="10" fill="#ffffff" stroke="#4c6070"/>
<text x="128.66" y="172.72" font-size="14" fill="#183247" font-weight="700" text-anchor="middle">+</text>
<path d="M 360 110 L 163 184" stroke="#4c6070" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="206.34" cy="167.72" r="10" fill="#ffffff" stroke="#4c6070"/>
<text x="206.34" y="172.72" font-size="14" fill="#183247" font-weight="700" text-anchor="middle">+</text>
<path d="M 170 110 L 337 184" stroke="#4c6070" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="300.26" cy="167.72" r="10" fill="#ffffff" stroke="#4c6070"/>
<text x="300.26" y="172.72" font-size="14" fill="#183247" font-weight="700" text-anchor="middle">+</text>
<path d="M 360 110 L 383 184" stroke="#4c6070" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="377.94" cy="167.72" r="10" fill="#ffffff" stroke="#4c6070"/>
<text x="377.94" y="172.72" font-size="14" fill="#183247" font-weight="700" text-anchor="middle">−</text>
<path d="M 170 110 L 528 184" stroke="#4c6070" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="449.24" cy="167.72" r="10" fill="#ffffff" stroke="#4c6070"/>
<text x="449.24" y="172.72" font-size="14" fill="#183247" font-weight="700" text-anchor="middle">−</text>
<path d="M 360 110 L 580 184" stroke="#4c6070" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="531.6" cy="167.72" r="10" fill="#ffffff" stroke="#4c6070"/>
<text x="531.6" y="172.72" font-size="14" fill="#183247" font-weight="700" text-anchor="middle">−</text>
<path d="M 550 110 L 632 184" stroke="#4c6070" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="613.96" cy="167.72" r="10" fill="#ffffff" stroke="#4c6070"/>
<text x="613.96" y="172.72" font-size="14" fill="#183247" font-weight="700" text-anchor="middle">+</text>
<rect x="45" y="190" width="190" height="70" rx="10" fill="#f4f7f9" stroke="#4c6070"/>
<text x="140" y="216" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">Light–dark</text>
<text x="140" y="242" font-size="15" fill="#4c6070" font-weight="400" text-anchor="middle">L + M</text>
<defs><linearGradient id="g140"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
<rect x="45" y="275" width="190" height="22" fill="url(#g140)" stroke="#4c6070"/>
<rect x="265" y="190" width="190" height="70" rx="10" fill="#f4f7f9" stroke="#4c6070"/>
<text x="360" y="216" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">Red–green</text>
<text x="360" y="242" font-size="15" fill="#4c6070" font-weight="400" text-anchor="middle">L − M</text>
<defs><linearGradient id="g360"><stop offset="0" stop-color="#2e8b57"/><stop offset="1" stop-color="#c0392b"/></linearGradient></defs>
<rect x="265" y="275" width="190" height="22" fill="url(#g360)" stroke="#4c6070"/>
<rect x="485" y="190" width="190" height="70" rx="10" fill="#f4f7f9" stroke="#4c6070"/>
<text x="580" y="216" font-size="17" fill="#183247" font-weight="700" text-anchor="middle">Blue–yellow</text>
<text x="580" y="242" font-size="15" fill="#4c6070" font-weight="400" text-anchor="middle">S − (L + M)</text>
<defs><linearGradient id="g580"><stop offset="0" stop-color="#e3b505"/><stop offset="1" stop-color="#2f5fb3"/></linearGradient></defs>
<rect x="485" y="275" width="190" height="22" fill="url(#g580)" stroke="#4c6070"/>
<text x="360" y="320" font-size="14" fill="#4c6070" font-weight="400" text-anchor="middle">Three opponent channels leave the eye. Only the light–dark channel carries fine detail.</text>
</svg>
