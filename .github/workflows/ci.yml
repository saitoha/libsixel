name: libsixel CI (build & test)

on:
  push:
    branches-ignore:
      - 'ci/triage/**'
      - 'triage/**'
      - 'experimental/**'
  pull_request:
    branches: ['**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pin vcpkg to a stable release to avoid fetching future tool builds that
  # depend on unavailable CMake versions during bootstrap.
  VCPKG_REF: 2026.07.29
  # Enforce Node.js 24 for JavaScript actions before the hosted-runner switch.
  # Node.js 24 becomes default on 2026-06-02 and Node.js 20 is removed on
  # 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Autotools-ubuntu-x86_64-gcc
            buildtool: autotools
            runner: ubuntu-latest
            extra_packages: >-
              clang
            exec_type: bash

          - label: Meson-ubuntu-x86_64-gcc
            buildtool: meson
            runner: ubuntu-latest
            extra_packages: >-
              meson
            exec_type: bash

          - label: Autotools-macos-aarch64-gcc
            buildtool: autotools
            runner: macos-latest
            exec_type: bash

          - label: Meson-macos-aarch64-gcc
            buildtool: meson
            runner: macos-latest
            extra_packages: >-
              meson
            exec_type: bash

          - label: Meson-cmd-x86_64-msvc-x86_64
            buildtool: meson
            runner: windows-latest
            exec_type: cmd

    steps:
      - name: Set Windows Defender ExclusionPath (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "C:\a" -ErrorAction Stop
          } catch {
            Write-Warning "Windows Defender exclusion setup failed; continuing: $($_.Exception.Message)"
          }

      - name: Disable Windows Search Indexer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Stop-Service WSearch -ErrorAction Continue

      - name: Disable Spotlight (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo mdutil -i off / || true
          sudo mdutil -i off /System/Volumes/Data || true

      - name: Configure git EOL
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run CI steps
        uses: ./.github/actions/ci-steps
        with:
          matrix_json: ${{ toJSON(matrix) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  color-compat:
    name: Linux ${{ matrix.cc }} color and v1.8.7 compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          path: current
      - uses: actions/checkout@v6
        with:
          # The released headers and library must come from the same revision.
          ref: 764f4e618c8bbc427fb74622e3227243fe6762fb # v1.8.7-r2
          path: baseline
      - uses: actions/checkout@v6
        with:
          ref: 24c34a23461a7d5034a43a365723ceda04eecdf5 # v1.8.7
          path: original
      - name: Install PNG and ELF build dependencies
        run: bash current/.github/scripts/install-ubuntu-packages.sh libpng-dev binutils
      - name: Check release client and builtin CMS output
        working-directory: current
        env:
          CC: ${{ matrix.cc }}
        run: |
          sh .github/scripts/check-color-compat.sh \
            "$GITHUB_WORKSPACE/baseline" "$RUNNER_TEMP/color-compat" "$GITHUB_WORKSPACE/original"

  tcc:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Autotools-ubuntu-x86_64-tcc-shared
            buildtool: autotools
            runner: ubuntu-latest
            extra_packages: >-
              clang
              tcc
              libc6-dev
              binutils
            setup_prefix: >-
              CC=tcc
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-tcc-static
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=tcc
            setup_options: >-
              --disable-shared
            extra_packages: >-
              clang
              tcc
              libc6-dev
              binutils
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-tcc-shared-png-jpeg-tiff-webp
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=tcc
            setup_options: >-
              --with-png
              --with-jpeg
              --with-tiff
              --with-webp
            extra_packages: >-
              clang
              tcc
              libc6-dev
              binutils
              libpng-dev
              libjpeg-dev
              libtiff-dev
              libwebp-dev
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-tcc-shared-gd
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=tcc
            setup_options: >-
              --with-gd
            extra_packages: >-
              clang
              tcc
              libc6-dev
              binutils
              libgd-dev
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-tcc-no-threads
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=tcc
            setup_options: >-
              --disable-threads
            extra_packages: >-
              clang
              tcc
              libc6-dev
              binutils
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-tcc-amalgamated_lib
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=tcc
            setup_options: >-
              --enable-amalgamated-lib
            extra_packages: >-
              clang
              tcc
              libc6-dev
              binutils
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-tcc-amalgamated_tools
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=tcc
            setup_options: >-
              --enable-amalgamated-tools
            extra_packages: >-
              clang
              tcc
              libc6-dev
              binutils
            exec_type: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run CI steps
        uses: ./.github/actions/ci-steps
        with:
          matrix_json: ${{ toJSON(matrix) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  icx-x86_64:
    if: github.event_name != 'schedule'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Meson-ubuntu-24.04-x86_64-icx-2026.1
            runner: ubuntu-24.04

          - label: Meson-windows-2022-x86_64-icx-2026.1
            runner: windows-2022
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ONEAPI_CACHE_REVISION: '1'
      ONEAPI_LINUX_PACKAGE_VERSION: 2026.1.1-325
      ONEAPI_WINDOWS_COMPONENT: intel.oneapi.win.cpp-dpcpp-common
      ONEAPI_WINDOWS_TOOLKIT_URL: >-
        https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache Intel oneAPI compiler (Linux)
        if: runner.os == 'Linux'
        id: cache-oneapi-linux
        uses: actions/cache@v5
        with:
          path: /opt/intel/oneapi/compiler
          key: >-
            oneapi-linux-x86_64-${{ env.ONEAPI_LINUX_PACKAGE_VERSION }}-${{ env.ONEAPI_CACHE_REVISION }}

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends ca-certificates gpg meson ninja-build

      - name: Install Intel oneAPI compiler (Linux)
        if: >-
          ${{ runner.os == 'Linux'
              && steps.cache-oneapi-linux.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor > /tmp/oneapi-archive-keyring.gpg
          sudo install -m 0644 /tmp/oneapi-archive-keyring.gpg \
            /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends \
            "intel-oneapi-compiler-dpcpp-cpp=$ONEAPI_LINUX_PACKAGE_VERSION"

      - name: Build and run with icx (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          # Intel's environment script reads optional unset variables.
          set +u
          . /opt/intel/oneapi/compiler/latest/env/vars.sh
          set -u
          test "$(uname -m)" = x86_64
          icx --version
          icx -dumpmachine
          CC=icx meson setup builddir-icx \
            -Ddefault_library=static \
            -Dtests=false \
            -Dpng=disabled \
            -Djpeg=disabled \
            -Dtiff=disabled \
            -Dwebp=disabled \
            -Dlibrsvg=disabled \
            -Dgd=disabled \
            -Dgdk_pixbuf2=disabled \
            -Dlcms2=disabled \
            -Dcurl=disabled \
            -Dfetch=disabled
          meson compile -C builddir-icx -v img2sixel sixel2png
          builddir-icx/converters/img2sixel --version
          builddir-icx/converters/sixel2png --version

      - name: Cache Intel oneAPI compiler (Windows)
        if: runner.os == 'Windows'
        id: cache-oneapi-windows
        uses: actions/cache@v5
        with:
          path: |
            C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat
            C:\Program Files (x86)\Intel\oneAPI\compiler
          key: >-
            oneapi-windows-x86_64-2026.1.0-${{ env.ONEAPI_CACHE_REVISION }}

      - name: Install Intel oneAPI compiler (Windows)
        if: >-
          ${{ runner.os == 'Windows'
              && steps.cache-oneapi-windows.outputs.cache-hit != 'true' }}
        shell: cmd
        run: |
          curl.exe --fail --location --retry 5 --retry-delay 5 --output "%RUNNER_TEMP%\oneapi.exe" --url "%ONEAPI_WINDOWS_TOOLKIT_URL%"
          start "" /b /wait "%RUNNER_TEMP%\oneapi.exe" -s -x -f "%RUNNER_TEMP%\oneapi-extracted" --log "%RUNNER_TEMP%\oneapi-extract.log"
          if errorlevel 1 exit /b %errorlevel%
          start "" /b /wait "%RUNNER_TEMP%\oneapi-extracted\bootstrapper.exe" -s --action install --components=%ONEAPI_WINDOWS_COMPONENT% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir="%RUNNER_TEMP%"
          if errorlevel 1 exit /b %errorlevel%
          del "%RUNNER_TEMP%\oneapi.exe"
          rmdir /s /q "%RUNNER_TEMP%\oneapi-extracted"

      - name: Install build prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install meson ninja

      - name: Build and run with icx (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat" vs2022
          for /f "tokens=* usebackq" %%f in (`dir /b "C:\Program Files (x86)\Intel\oneAPI\compiler\" ^| findstr /V latest ^| sort`) do set "ONEAPI_COMPILER_VERSION=%%f"
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\%ONEAPI_COMPILER_VERSION%\env\vars.bat"
          if not "%PROCESSOR_ARCHITECTURE%" == "AMD64" exit /b 1
          where icx
          icx --version
          set "CC=icx"
          meson setup builddir-icx -Ddefault_library=static -Dtests=false -Dpng=disabled -Djpeg=disabled -Dtiff=disabled -Dwebp=disabled -Dlibrsvg=disabled -Dgd=disabled -Dgdk_pixbuf2=disabled -Dlcms2=disabled -Dcurl=disabled -Dfetch=disabled
          meson compile -C builddir-icx -v img2sixel sixel2png
          builddir-icx\converters\img2sixel.exe --version
          builddir-icx\converters\sixel2png.exe --version

  staticcheck:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Autotools-ubuntu-x86_64-gcc-staticcheck
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              mkdir -p "$HOME/.local/bin";
              command -v actionlint >/dev/null 2>&1 ||
              { curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash |
              bash -s -- latest "$HOME/.local/bin"; };
              PATH="$HOME/.local/bin:$PATH"
            check_target: staticcheck
            extra_packages: >-
              shellcheck
              codespell
              curl
            exec_type: bash

          - label: Meson-ubuntu-x86_64-gcc-staticcheck
            buildtool: meson
            runner: ubuntu-latest
            setup_prefix: >-
              mkdir -p "$HOME/.local/bin";
              command -v actionlint >/dev/null 2>&1 ||
              { curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash |
              bash -s -- latest "$HOME/.local/bin"; };
              PATH="$HOME/.local/bin:$PATH"
            check_target: compile staticcheck
            extra_packages: >-
              meson
              shellcheck
              codespell
              curl
            exec_type: bash

    steps:
      - name: Set Windows Defender ExclusionPath (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "C:\a" -ErrorAction Stop
          } catch {
            Write-Warning "Windows Defender exclusion setup failed; continuing: $($_.Exception.Message)"
          }

      - name: Disable Windows Search Indexer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Stop-Service WSearch -ErrorAction Continue

      - name: Disable Spotlight (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo mdutil -i off / || true
          sudo mdutil -i off /System/Volumes/Data || true

      - name: Configure git EOL
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run CI steps
        uses: ./.github/actions/ci-steps
        with:
          matrix_json: ${{ toJSON(matrix) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  static-analyze:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Meson-cmd-x86_64-msvc-static-analyze
            runner: windows-latest
            analyzer: msvc

          - label: Autotools-ubuntu-x86_64-clang-static-analyze
            runner: ubuntu-latest
            analyzer: clang

          - label: Autotools-ubuntu-x86_64-gcc-static-analyze
            runner: ubuntu-latest
            analyzer: gcc

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup MSVC developer env
        if: ${{ matrix.analyzer == 'msvc' }}
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.github\scripts\setup-msvc-env.ps1" -Arch x64

      - name: Build with MSVC /W4 /analyze
        if: ${{ matrix.analyzer == 'msvc' }}
        shell: cmd
        run: |
          setlocal ENABLEDELAYEDEXPANSION
          python -m pip install --upgrade pip
          if errorlevel 1 exit /b !errorlevel!
          python -m pip install meson
          if errorlevel 1 exit /b !errorlevel!
          python -m mesonbuild.mesonmain setup builddir -Danalyzer=true
          if errorlevel 1 exit /b !errorlevel!
          python -m mesonbuild.mesonmain compile -C builddir --ninja-args=-k0
          if errorlevel 1 exit /b !errorlevel!
          endlocal

      - name: Install Clang Static Analyzer
        if: ${{ matrix.analyzer == 'clang' }}
        shell: bash
        run: |
          set -eux
          bash .github/scripts/disable-hosted-runner-microsoft-apt-sources.sh
          sudo apt-get update
          sudo apt-get install -y clang clang-tools

      - name: Build with Clang Static Analyzer
        if: ${{ matrix.analyzer == 'clang' }}
        shell: bash
        run: |
          set -eux
          CC=clang ./configure --enable-analyzer
          SCAN_BUILD="$(command -v scan-build || command -v scan-build-18 || command -v scan-build-17 || command -v scan-build-16)"
          ROOT_DIR="$(pwd)"
          "$SCAN_BUILD" \
            --use-cc=clang \
            --use-c++=clang++ \
            -disable-checker deadcode.DeadStores \
            --exclude "$ROOT_DIR/assessment" \
            --exclude "$ROOT_DIR/tests" \
            --exclude "$ROOT_DIR/examples" \
            --exclude "$ROOT_DIR/drawing" \
            --exclude "$ROOT_DIR/python" \
            --exclude "$ROOT_DIR/ruby" \
            --exclude "$ROOT_DIR/windows" \
            --exclude "$ROOT_DIR/quicklook-extension" \
            --status-bugs \
            --keep-going \
            make -j"$(nproc)" V=1

      - name: Build with GCC Static Analyzer
        if: ${{ matrix.analyzer == 'gcc' }}
        shell: bash
        run: |
          set -eux
          CC=gcc ./configure --enable-analyzer
          make -j"$(nproc)" V=1

  pgo:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Autotools-ubuntu-x86_64-clang-pgo
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              export LLVM_PROFILE_FILE="${GITHUB_WORKSPACE}/pgo/default-%p-%m.profraw";
              mkdir build;
              cd build;
              rel=..;
              CC=clang
            setup_options: >-
              --enable-pgo=generate --with-pgo-data=${GITHUB_WORKSPACE}/pgo
            pgo_use_options: >-
              --enable-pgo=use --with-pgo-profdata=${GITHUB_WORKSPACE}/pgo/default.profdata
            extra_packages: >-
              clang
            exec_type: bash

          - label: Meson-ubuntu-x86_64-clang-pgo
            buildtool: meson
            runner: ubuntu-latest
            setup_prefix: >-
              export LLVM_PROFILE_FILE="$PWD/pgo/default-%p-%m.profraw";
              CC=clang
            setup_options: >-
              -Db_pgo=generate
            pgo_use_options: >-
              -Db_pgo=use
            extra_packages: >-
              meson
              clang
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-gcc-pgo
            buildtool: autotools
            runner: ubuntu-latest
            pgo_reuse_builddir: true
            setup_options: >-
              --enable-pgo=generate --with-pgo-data=${GITHUB_WORKSPACE}/pgo
            pgo_use_options: >-
              --enable-pgo=use --with-pgo-data=${GITHUB_WORKSPACE}/pgo
            extra_packages: >-
              clang
            exec_type: bash

          - label: Meson-ubuntu-x86_64-gcc-pgo
            buildtool: meson
            runner: ubuntu-latest
            setup_options: >-
              -Db_pgo=generate
            pgo_use_options: >-
              -Db_pgo=use
            extra_packages: >-
              meson
            exec_type: bash

          - label: Meson-cmd-x86_64-msvc-pgo-1-of-4
            test_shard: 1/4
            buildtool: meson
            runner: windows-latest
            setup_options: >-
              -Dmsvc_pgo=generate
            pgo_use_options: >-
              -Dmsvc_pgo=use
            exec_type: cmd

          - label: Meson-cmd-x86_64-msvc-pgo-2-of-4
            test_shard: 2/4
            buildtool: meson
            runner: windows-latest
            setup_options: >-
              -Dmsvc_pgo=generate
            pgo_use_options: >-
              -Dmsvc_pgo=use
            exec_type: cmd

          - label: Meson-cmd-x86_64-msvc-pgo-3-of-4
            test_shard: 3/4
            buildtool: meson
            runner: windows-latest
            setup_options: >-
              -Dmsvc_pgo=generate
            pgo_use_options: >-
              -Dmsvc_pgo=use
            exec_type: cmd

          - label: Meson-cmd-x86_64-msvc-pgo-4-of-4
            test_shard: 4/4
            buildtool: meson
            runner: windows-latest
            setup_options: >-
              -Dmsvc_pgo=generate
            pgo_use_options: >-
              -Dmsvc_pgo=use
            exec_type: cmd

    steps:
      - name: Set Windows Defender ExclusionPath (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "C:\a" -ErrorAction Stop
          } catch {
            Write-Warning "Windows Defender exclusion setup failed; continuing: $($_.Exception.Message)"
          }

      - name: Disable Windows Search Indexer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Stop-Service WSearch -ErrorAction Continue

      - name: Disable Spotlight (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo mdutil -i off / || true
          sudo mdutil -i off /System/Volumes/Data || true

      - name: Configure git EOL
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run CI steps
        uses: ./.github/actions/ci-steps
        with:
          matrix_json: ${{ toJSON(matrix) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  python:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Autotools-ubuntu-x86_64-gcc-python
            buildtool: autotools
            runner: ubuntu-latest
            setup_options: >-
              --enable-python
            extra_packages: >-
              clang
            pip_packages: >-
              build
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-gcc-python-vpath_build
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              mkdir build;
              cd build;
              rel=..;
            setup_options: >-
              --enable-python
            extra_packages: >-
              clang
            pip_packages: >-
              build
            exec_type: bash

          - label: Meson-ubuntu-x86_64-gcc-python
            buildtool: meson
            runner: ubuntu-latest
            setup_options: >-
              -Dpython=enabled
            extra_packages: >-
              meson
            pip_packages: >-
              build
            exec_type: bash

          - label: Autotools-macos-aarch64-gcc-python
            buildtool: autotools
            runner: macos-latest
            setup_options: >-
              --enable-python
            pip_packages: >-
              build
            exec_type: bash

          - label: Meson-macos-aarch64-gcc-python
            buildtool: meson
            runner: macos-latest
            setup_options: >-
              -Dpython=enabled
            extra_packages: >-
              meson
            pip_packages: >-
              build
            exec_type: bash

