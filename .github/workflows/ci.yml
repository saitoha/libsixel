            runner: ubuntu-24.04-arm
            webgpu_tests: true
            setup_options: >-
              --host=wasm32-unknown-emscripten
              --with-shebang-file="$PWD/build-aux/shebang/node"
              --disable-shared
              --disable-threads
              --enable-emscripten-webgpu
              --disable-emscripten-noderawfs
              --without-libfetch
            check_target: >-
              check TESTS='platform/webgpu/0001_palette_byte_equivalence.t
              platform/webgpu/0002_force_exit_status.t
              platform/webgpu/0003_diffusion_equivalence.t
              platform/webgpu/0004_auto_output_fallback.t'
