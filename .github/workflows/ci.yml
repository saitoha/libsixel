    if: github.event_name != 'schedule'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # MSYS process startup and the full codec test matrix exceed 90 minutes
    # while still making progress. Keep a finite budget for build and tests.
    timeout-minutes: 240
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
