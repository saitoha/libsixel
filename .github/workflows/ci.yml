    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Autotools-ubuntu-x86_64-static-coverage
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=gcc-14
            setup_options: >-
              --enable-gcov
              --disable-shared
              --enable-static
            extra_packages: >-
              gcc-14
              gcovr
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-no-simd-coverage
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=gcc-14
            setup_options: >-
              --enable-gcov
              --disable-simd
            extra_packages: >-
              gcc-14
            pip_packages: >-
              gcovr
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-no-threads-coverage
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=gcc-14
            setup_options: >-
              --enable-gcov
              --disable-threads
            extra_packages: >-
              gcc-14
            pip_packages: >-
              gcovr
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-lcms2-coverage
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=clang
            setup_options: >-
              --enable-gcov
              --without-png
              --without-jpeg
              --without-tiff
              --without-webp
              --without-librsvg
              --with-lcms2
            extra_packages: >-
              meson
              clang
              llvm
              liblcms2-dev
            pip_packages: >-
              gcovr==8.8
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-clang-png-jpeg-tiff-webp-svg-coverage
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=clang
            setup_options: >-
              --enable-gcov
              --with-png
              --with-jpeg
              --with-tiff
              --with-webp
              --with-librsvg
              --without-lcms2
            extra_packages: >-
              meson
              clang
              llvm
              libpng-dev
              libjpeg-dev
              libtiff-dev
              libwebp-dev
              librsvg2-dev
            pip_packages: >-
              gcovr==8.8
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-clang-png-jpeg-tiff-webp-svg-lcms2-coverage
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=clang
            setup_options: >-
              --enable-gcov
              --with-png
              --with-jpeg
              --with-tiff
              --with-webp
              --with-librsvg
              --with-lcms2
            extra_packages: >-
              meson
              clang
              llvm
              libpng-dev
              libjpeg-dev
              libtiff-dev
              libwebp-dev
              librsvg2-dev
              liblcms2-dev
            pip_packages: >-
              gcovr==8.8
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-gdk-pixbuf2-coverage
            buildtool: autotools
            runner: ubuntu-latest
            setup_prefix: >-
              CC=clang
            setup_options: >-
              --enable-gcov
              --without-png
              --without-jpeg
              --without-tiff
              --with-gdk-pixbuf2
            extra_packages: >-
              clang
              llvm
              libgdk-pixbuf-2.0-dev
            pip_packages: >-
              gcovr==8.8
            exec_type: bash

          - label: Autotools-ubuntu-x86_64-GD-no-aborttrace-coverage
            buildtool: autotools
