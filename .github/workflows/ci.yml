  sparc64-netbsd:
    if: github.event_name != 'schedule'
    concurrency:
      group: libsixel-vm
      queue: max
      cancel-in-progress: false
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: Autotools-netbsd-11.0-sparc64-system-cc
            buildtool: autotools

          - label: Meson-netbsd-11.0-sparc64-system-cc
            buildtool: meson
    steps:
      - uses: actions/checkout@v6

      - name: Fetch GNU make for NetBSD/sparc64
        if: matrix.buildtool == 'autotools'
        shell: bash
        run: |
          set -euo pipefail
          # Fetch on the host so the guest can install without mirror lookup.
          mkdir -p .tmp/netbsd-sparc64
          cd .tmp/netbsd-sparc64
          package=gmake-4.4.1.tgz
          package_path=packages/NetBSD/sparc64/11.0_2026Q2/All/$package
          package_sha=d10d53aac64a9a5e75c9c19c24be211dce8177ebef6ffc5821d07e1d4d691d8e
          # Use independent HTTPS endpoints. Only publish verified bytes.
          for mirror in https://cdn.netbsd.org/pub/pkgsrc \
                        https://ftp.netbsd.org/pub/pkgsrc \
                        https://ftp.jaist.ac.jp/pub/pkgsrc; do
            if curl --fail --location --connect-timeout 15 --max-time 60 \
                "$mirror/$package_path" --output "$package.part" &&
                printf '%s  %s\n' "$package_sha" "$package.part" | sha256sum -c -; then
              mv "$package.part" "$package"
              exit 0
            fi
          done
          printf 'Could not fetch a verified NetBSD/sparc64 %s\n' "$package" >&2
          exit 1

      # Retry provisioning only; the build below is outside both attempts.
      - name: Prepare NetBSD/sparc64 (attempt 1)
        id: sparc_prepare_1
        continue-on-error: true
        timeout-minutes: 25
        uses: vmactions/netbsd-vm@20ee93a005c9fc78743e6e05269f4cb023b87413 # v1.5.0
        with:
          arch: sparc64
          copyback: false
          cpu: 2
          mem: 4096
          release: '11.0'
          sync: scp
          # The action syncs $HOME/work, including runner.temp, into the VM.
          # Keep live disk images outside that tree to avoid copying them.
          data-dir: $HOME/.cache/libsixel-sparc-vm-1
          prepare: |
            set -eux
            if test '${{ matrix.buildtool }}' = autotools; then
              /usr/sbin/pkg_add -u "$GITHUB_WORKSPACE/.tmp/netbsd-sparc64/gmake-4.4.1.tgz"
            else
              /usr/sbin/pkg_add -u meson ninja-build
            fi

      - name: Reset failed SPARC VM before retry
        if: steps.sparc_prepare_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          # This dedicated runner hosts only the SPARC provisioning attempt.
          # Kill the failed guest before starting another snapshot; remove
          # its aliases because SSH otherwise selects the first stale port.
          if pgrep -f '(^|/)qemu-system-sparc64( |$)' >/dev/null; then
            pkill -TERM -f '(^|/)qemu-system-sparc64( |$)' || test "$?" -eq 1
            for attempt in 1 2 3 4 5; do
              pgrep -f '(^|/)qemu-system-sparc64( |$)' >/dev/null || break
              sleep "$attempt"
            done
            if pgrep -f '(^|/)qemu-system-sparc64( |$)' >/dev/null; then
              pkill -KILL -f '(^|/)qemu-system-sparc64( |$)' || test "$?" -eq 1
            fi
          fi
          for config in "$HOME"/.ssh/config.d/*.conf; do
            test -f "$config" || continue
            if awk '$1 == "Host" { for (i = 2; i <= NF; ++i) if ($i == "netbsd") found = 1 } END { exit !found }' "$config"; then
              rm -f "$config"
            fi
          done

      - name: Prepare NetBSD/sparc64 (attempt 2)
        id: sparc_prepare_2
        if: steps.sparc_prepare_1.outcome == 'failure'
        timeout-minutes: 25
        uses: vmactions/netbsd-vm@20ee93a005c9fc78743e6e05269f4cb023b87413 # v1.5.0
        with:
          disable-cache: true
          arch: sparc64
          copyback: false
          cpu: 2
          mem: 4096
          release: '11.0'
          sync: scp
          data-dir: $HOME/.cache/libsixel-sparc-vm-2
          prepare: |
            set -eux
            if test '${{ matrix.buildtool }}' = autotools; then
              /usr/sbin/pkg_add -u "$GITHUB_WORKSPACE/.tmp/netbsd-sparc64/gmake-4.4.1.tgz"
            else
              /usr/sbin/pkg_add -u meson ninja-build
            fi

      - name: Build and test inside NetBSD/sparc64
        if: steps.sparc_prepare_1.outcome == 'success' || steps.sparc_prepare_2.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=60 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            netbsd sh -e <<'SIXEL_SPARC_BUILD'
            cd "$GITHUB_WORKSPACE"
            set -eux
            uname -a
            cc -dumpmachine
            file /bin/sh
            # SPARC64 uses full-system TCG emulation on x86_64 runners. Keep
            # this ABI/runtime probe focused by avoiding optimizer cost.
            CFLAGS='-O0 -g0'
            export CFLAGS
            # Keep the same target-executed black-box contracts as the Linux
            # emulation matrix while generic runners own the aggregate tests.
            set -- \
              cli/img2sixel/0002_version.t \
              cli/img2sixel/0007_basic_stdin_snake.t \
              cli/img2sixel/0019_basic_parallel_cli_override.t \
              cli/sixel2png/0006_stdin_default_output.t \
              cli/output-format/0006_gray8_output.t \
              encoder/sixel-output/0003_direct_sixel_encode.t \
              palette/mapfile-io/0109_mapfile_export_act_256_color_count.t \
              writer/png/0007_builtin_ihdr_crc.t \
              decoder/parser/0122_issue220_dcs_signed_integer_overflow.t
            rm -rf /tmp/libsixel-build
            mkdir /tmp/libsixel-build
            if test '${{ matrix.buildtool }}' = autotools; then
              cd /tmp/libsixel-build
              "$GITHUB_WORKSPACE/configure" \
                --disable-dependency-tracking \
                --disable-tests
              gmake -j2 V=1 -C src
              gmake -j2 V=1 -C converters
              IMG2SIXEL_PATH=/tmp/libsixel-build/converters/img2sixel
              SIXEL2PNG_PATH=/tmp/libsixel-build/converters/sixel2png
            else
              meson setup /tmp/libsixel-build "$GITHUB_WORKSPACE" \
                -Dtests=false
              meson compile -C /tmp/libsixel-build -j 2 -v \
                img2sixel sixel2png
              IMG2SIXEL_PATH=/tmp/libsixel-build/converters/img2sixel
              SIXEL2PNG_PATH=/tmp/libsixel-build/converters/sixel2png
            fi
            export IMG2SIXEL_PATH SIXEL2PNG_PATH
            export HAVE_IMG2SIXEL=1 HAVE_SIXEL2PNG=1
            export TOP_BUILDDIR=/tmp/libsixel-build
            export TOP_SRCDIR="$GITHUB_WORKSPACE"
            for smoke_test in "$@"; do
              ARTIFACT_LOCAL_DIR="/tmp/libsixel-artifacts/${smoke_test%.*}"
              export ARTIFACT_LOCAL_DIR
              sh "$GITHUB_WORKSPACE/tests/meson-tap-exitcode-wrapper.sh" \
                "$GITHUB_WORKSPACE/tests/$smoke_test"
            done
          SIXEL_SPARC_BUILD

