  core-meson-ubuntu:
    needs: [coverage-meson]
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: Meson-ubuntu-x86_64-clang
            buildtool: meson
            runner: ubuntu-latest
            setup_prefix: >-
              CC=clang
            setup_options: >-
              -Dpng=disabled
              -Djpeg=disabled
              -Dtiff=disabled
            extra_packages: >-
              meson
              clang
            exec_type: bash

          - label: Meson-ubuntu-x86_64-no-tools
            buildtool: meson
            runner: ubuntu-latest
            setup_options: >-
              -Dimg2sixel=disabled
              -Dsixel2png=disabled
            extra_packages: >-
              meson
            exec_type: bash

          - label: Meson-ubuntu-x86_64-musl
            buildtool: meson
            runner: ubuntu-latest
            setup_prefix: >-
              CC=musl-gcc
            extra_packages: >-
              meson
              musl-tools
            exec_type: bash

          - label: Meson-ubuntu-24.04-aarch64-amalgamated_lib
            buildtool: meson
            runner: ubuntu-24.04-arm
            setup_prefix: >-
              CC=gcc-14
            setup_options: >-
              -Damalgamated_lib=true
            extra_packages: >-
