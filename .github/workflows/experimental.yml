name: libsixel experimental CI

on:
  push:
    branches-ignore:
      - 'ci/triage/**'
      - 'triage/**'
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  emscripten-windows:
    name: Meson-windows-x86_64-emscripten-static
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EMSDK_VERSION: 7.0.0
    steps:
      - name: Configure git EOL
        shell: cmd
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Meson and Ninja
        shell: cmd
        run: python -m pip install meson==1.11.1 ninja==1.13.2

      - name: Build and test the installed Wasm converters
        shell: cmd
        run: |
          set "PATH=%pythonLocation%;%pythonLocation%\Scripts;%SystemRoot%\System32;%SystemRoot%;%ProgramFiles%\Git\cmd"
          set "SIXEL_EMSDK_DIR=%RUNNER_TEMP%\emsdk"
          set "SIXEL_EMCC_BUILD_DIR=%RUNNER_TEMP%\libsixel-wasm"
          call build-examples\example-build-emcc.cmd

  wasi:
    name: Meson-${{ matrix.platform }}-clang-wasi-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            wasmtime: x86_64-linux
            extension: tar.xz
          - os: macos-15
            platform: macos-arm64
            wasmtime: aarch64-macos
            extension: tar.xz
          - os: windows-2025
            platform: windows-x86_64
            wasmtime: x86_64-windows
            extension: zip
    steps:
      - name: Configure git EOL on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Meson and Ninja
        run: python -m pip install meson==1.11.1 ninja==1.13.2

      - name: Install Wasmtime
        shell: pwsh
        env:
          WASMTIME_PLATFORM: ${{ matrix.wasmtime }}
          WASMTIME_EXTENSION: ${{ matrix.extension }}
        run: |
          Set-Location $env:RUNNER_TEMP
          $runtime = "wasmtime-v51.0.0-$env:WASMTIME_PLATFORM"
          curl -fLsS --retry 3 -o "runtime.$env:WASMTIME_EXTENSION" "https://github.com/bytecodealliance/wasmtime/releases/download/v51.0.0/$runtime.$env:WASMTIME_EXTENSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf "runtime.$env:WASMTIME_EXTENSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIXEL_WASI_BUILD_DIR=$(Join-Path $env:RUNNER_TEMP 'libsixel WASI')" >> $env:GITHUB_ENV
          $runtimeDir = Join-Path $env:RUNNER_TEMP $runtime
          "SIXEL_WASMTIME_DIR=$runtimeDir" >> $env:GITHUB_ENV
          $runtimeDir >> $env:GITHUB_PATH

      - name: Build and test the installed WASI tools with Wasmtime
        id: wasmtime
        if: runner.os != 'Windows'
        shell: bash
        run: build-examples/example-build-wasi.sh --check

      - name: Build and test the installed WASI tools with Wasmtime on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%pythonLocation%;%pythonLocation%\Scripts;%SIXEL_WASMTIME_DIR%;%SystemRoot%\System32;%SystemRoot%"
          call build-examples\example-build-wasi.cmd --check

      - name: Install Wasmer on Linux
        id: wasmer
        if: runner.os == 'Linux' && steps.wasmtime.outcome == 'success'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o wasmer.tar.gz https://github.com/wasmerio/wasmer/releases/download/v7.5.0/wasmer-linux-amd64.tar.gz
          mkdir wasmer
          tar -xf wasmer.tar.gz -C wasmer bin/wasmer
          printf '%s\n' "$RUNNER_TEMP/wasmer/bin" >> "$GITHUB_PATH"

      - name: Smoke test the installed WASI modules with Wasmer
        if: runner.os == 'Linux' && steps.wasmer.outcome == 'success'
        shell: bash
        run: build-examples/example-build-wasi.sh --smoke wasmer

      - name: Install Node.js 24 on Linux
        id: node
        if: runner.os == 'Linux' && !cancelled() && steps.wasmtime.outcome == 'success'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Smoke test the installed WASI modules with Node.js
        if: runner.os == 'Linux' && !cancelled() && steps.node.outcome == 'success'
        shell: bash
        run: build-examples/example-build-wasi.sh --smoke node
